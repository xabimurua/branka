name: Publicar noticias de Branka (manual, desactivado)

# Desactivado: la publicación diaria la hace ahora una tarea programada de Claude
# (ver scripts/ACTUALIZACION_DIARIA.md). Solo se puede lanzar a mano.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branka-noticias-diarias
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar horario de España
        id: hora
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$(TZ=Europe/Madrid date +%H)" = "08" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Descargar repositorio
        if: steps.hora.outputs.publicar == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        if: steps.hora.outputs.publicar == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Redactar análisis originales con varias fuentes
        if: steps.hora.outputs.publicar == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRANKA_NEWS_MODEL: gpt-4.1-mini
        run: python scripts/publicar_noticias.py
      - name: Actualizar catálogo de podcasts y episodios
        if: steps.hora.outputs.publicar == 'true'
        run: python scripts/actualizar_podcasts.py
      - name: Crear páginas HTML indexables y sitemap
        if: steps.hora.outputs.publicar == 'true'
        env:
          SITE_URL: https://branka.es
        run: python scripts/generar_paginas_seo.py
      - name: Publicar los cambios en main
        if: steps.hora.outputs.publicar == 'true'
        run: |
          git add index.html noticias.html guias.html robots.txt noticias/ herramientas/ contenido/
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if git diff --cached --quiet; then
            echo "No hay noticias nuevas verificadas. La web se mantiene intacta."
            exit 0
          fi
          git config user.name "Branka Noticias Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Noticias: actualización diaria automática"
          git push

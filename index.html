<style>
:root {
  /* Branka: el degradado del icono (naranja → rojo) para cabecera, acciones y acentos; fondo claro cálido para leer cómodo.
     Layout: cabecera roja con el icono, ruta de 5 fases como filtro, biblioteca en rejilla y ficha de detalle por herramienta. */
  --brand: #a52b17;
  --orange: #ec8f35;
  --red: #da3a22;
  --grad: linear-gradient(135deg, #ec8f35 0%, #e0602b 45%, #da3a22 100%);
  --bg: #fdf7f3;
  --surface: #ffffff;
  --surface-2: #fbeee6;
  --line: #f0d9cc;
  --text: #2b110b;
  --muted: #7a5548;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 17px; line-height: 1.55; }
a { color: var(--red); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
header.top { background: var(--brand); position: sticky; top: 0; z-index: 5; box-shadow: 0 1px 0 rgba(0,0,0,.08); }
header.top .wrap { display: flex; align-items: center; gap: 24px; min-height: 66px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: .04em; }
.brand img { width: 40px; height: 40px; border-radius: 10px; display: block; }
.brand small { font-family: var(--font-body); font-weight: 500; font-size: 14px; letter-spacing: 0; opacity: .85; }
nav.main { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
nav.main a { text-decoration: none; color: #ffd9c4; padding: 8px 16px; border-radius: 999px; font-weight: 600; }
nav.main a[aria-current="page"] { background: rgba(255,255,255,.16); color: #fff; }

.hero { margin: 0 calc(50% - 50vw); padding: 44px calc(50vw - 50%) 34px; background: var(--grad); color: #fff; position: relative; overflow: hidden; }
.hero > * { position: relative; max-width: 1132px; }
.hero::after { content: ""; position: absolute; right: -120px; bottom: -160px; width: 520px; height: 300px; border-radius: 50%; background: rgba(165,43,23,.35); transform: rotate(-38deg); }
.hero-in { display: grid; gap: 14px; }
.eyebrow { color: var(--red); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
.hero .eyebrow { color: #fff3e8; }
.hero h1 { font-size: clamp(32px, 5vw, 54px); font-weight: 800; max-width: 19ch; }
.hero p { color: #fff3ea; max-width: 62ch; margin: 0; font-size: 19px; }

.route { display: grid; grid-template-columns: repeat(5, 1fr); margin: 26px 0 0; position: relative; }
.route::before { content: ""; position: absolute; left: 10%; right: 10%; top: 23px; height: 4px; background: rgba(255,255,255,.35); border-radius: 2px; }
.route button { background: none; border: 0; cursor: pointer; display: grid; justify-items: center; gap: 6px; padding: 6px 4px; position: relative; color: #ffe6d6; }
.route .dot { width: 38px; height: 38px; border-radius: 50%; background: rgba(165,43,23,.55); border: 3px solid rgba(255,255,255,.55); display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #fff; }
.route .nm { font-weight: 700; font-size: 15px; text-align: center; color: #fff; }
.route .ct { font-size: 13px; }
.route button[aria-pressed="true"] .dot { background: #fff; color: var(--red); border-color: #fff; }

.toolbar { display: flex; gap: 12px; align-items: center; margin: 26px 0 18px; flex-wrap: wrap; }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; }
.search input { background: none; border: 0; outline: none; padding: 12px 0; width: 100%; }
.search:focus-within { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(236,143,53,.2); }
.toolbar .count { color: var(--muted); font-size: 15px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 12px 18px; font-weight: 700; text-decoration: none; border: 0; background: var(--surface-2); color: var(--text); cursor: pointer; }
.btn.primary { background: var(--grad); color: #fff; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding-bottom: 28px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px 16px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px; text-decoration: none; color: var(--text); position: relative; overflow: hidden; transition: box-shadow .15s, transform .15s; }
.card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--grad); }
.card:hover { box-shadow: 0 10px 28px rgba(165,43,23,.14); transform: translateY(-2px); }
.card .num { font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: .04em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; width: max-content; }
.card h3 { font-size: 22px; font-weight: 800; }
.card p { margin: 0; color: var(--muted); font-size: 15.5px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.ok { background: var(--grad); color: #fff; }
.chip.phase { color: var(--brand); background: #fde3d4; }

.detail { padding: 28px 0 64px; display: grid; gap: 26px; }
.crumbs { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 15px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }
.dhead { display: grid; gap: 10px; }
.dhead h1 { font-size: clamp(30px, 4.5vw, 48px); font-weight: 800; }
.layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 880px) { .layout { grid-template-columns: 1fr; } .route .nm { font-size: 12.5px; } .route .ct { display: none; } }
.player { aspect-ratio: 16 / 9; width: 100%; background: #6f1c0e; border-radius: 16px; overflow: hidden; position: relative; box-shadow: 0 12px 30px rgba(165,43,23,.18); }
.player video { width: 100%; height: 100%; display: block; background: #000; }
.poster { position: absolute; inset: 0; display: grid; align-content: center; gap: 10px; padding: 7%; background: linear-gradient(135deg, #962513, #761b0d); color: #fff; overflow: hidden; }
.poster::after { content: ""; position: absolute; right: -8%; bottom: -30%; width: 55%; height: 70%; border-radius: 50%; background: var(--grad); opacity: .55; transform: rotate(-38deg); }
.poster > * { position: relative; z-index: 1; }
.poster .k { color: #ffcd96; font-weight: 800; letter-spacing: .08em; font-size: clamp(11px, 1.4vw, 15px); }
.poster .t { font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 4vw, 44px); line-height: 1.08; max-width: 16ch; }
.poster .s { color: #ffdcc8; font-size: clamp(12px, 1.5vw, 16px); max-width: 44ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 10px; }
.panel h2 { font-size: 13px; font-family: var(--font-body); color: var(--red); letter-spacing: .08em; text-transform: uppercase; font-weight: 800; }
.panel p { margin: 0; }
.panel .big { font-size: 20px; font-weight: 600; }
.blocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.blocks span { background: var(--surface-2); border-left: 4px solid var(--orange); border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: 14.5px; }
.minroute { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.minroute span { height: 8px; border-radius: 4px; background: var(--line); }
.minroute span.on { background: var(--grad); }
.minroute + small { color: var(--muted); }
.guion p { color: #4a2a20; max-width: 65ch; }
.guion p + p { margin-top: 10px; }
.side { display: grid; gap: 16px; }
.tpl img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
.tpl .btn { width: 100%; }
.dlmsg { color: var(--muted); font-size: 14px; }
.dlmsg:empty { display: none; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pager a { flex: 1 1 240px; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; color: var(--text); display: grid; font-weight: 700; }
.pager a small { color: var(--muted); font-weight: 500; }
.pager a.next { text-align: right; }

.news-head { margin: 0 calc(50% - 50vw); padding: 40px calc(50vw - 50%) 30px; background: var(--grad); color: #fff; display: grid; gap: 10px; }
.news-head > * { max-width: 1132px; }
.news-head .eyebrow { color: #fff3e8; }
.news-head h1 { font-size: clamp(30px, 4.5vw, 48px); font-weight: 800; }
.news-head p { color: #fff3ea; max-width: 64ch; margin: 0; }
.news-top { display: grid; grid-template-columns: 1fr; gap: 24px; margin: 26px 0; align-items: center; }
@media (max-width: 880px) { .news-top { grid-template-columns: 1fr; } }
.news { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding-bottom: 64px; }
.story { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 12px; align-content: start; }
.story h3 { font-size: 22px; font-weight: 800; }
.story p { margin: 0; color: #4a2a20; font-size: 16px; }
.lesson { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; border-left: 4px solid var(--orange); }
.lesson b { color: var(--red); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; }
.lesson a { font-weight: 700; font-size: 15px; }
.srcs { font-size: 13.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.srcs a { color: var(--muted); }

.admin { border: 2px dashed var(--line); border-radius: 16px; padding: 18px 20px; margin: 22px 0 6px; display: grid; gap: 10px; background: var(--surface); }
.admin[hidden] { display: none; }
.admin h2 { font-size: 18px; }
.admin p { margin: 0; color: var(--muted); font-size: 15px; }
.drop { border: 2px dashed #e9b79c; border-radius: 12px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; }
.drop.over { border-color: var(--red); color: var(--text); background: var(--surface-2); }
.log { font-size: 14px; color: var(--muted); display: grid; gap: 2px; max-height: 180px; overflow: auto; }
.log .good { color: #1f7a4a; }
.log .bad { color: #b3261e; }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; padding: 22px 0 32px; }

.feat { display: grid; grid-template-columns: 300px 1fr; gap: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; margin: 28px 0 8px; align-items: center; }
@media (max-width: 760px) { .feat { grid-template-columns: 1fr; } }
.feat-art { aspect-ratio: 1; border-radius: 16px; background: var(--grad); display: grid; place-content: center; text-align: center; color: #fff; position: relative; overflow: hidden; }
.feat-art::after { content: ""; position: absolute; width: 70%; height: 40%; right: -15%; bottom: -10%; border-radius: 50%; background: rgba(165,43,23,.45); transform: rotate(-38deg); }
.feat-art span { font-family: var(--font-display); font-weight: 800; font-size: 64px; letter-spacing: -.02em; position: relative; z-index: 1; }
.feat-art small { font-weight: 800; letter-spacing: .3em; position: relative; z-index: 1; }
.feat-body { display: grid; gap: 10px; }
.feat-body h2 { font-size: clamp(26px, 3.4vw, 36px); font-weight: 800; }
.feat-body .by { color: var(--red); font-weight: 600; margin: 0; }
.feat-body p { margin: 0; max-width: 62ch; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { padding: 9px 14px; font-size: 15px; }
.note { color: var(--muted); font-size: 13.5px; }
.sec-h { font-size: 26px; font-weight: 800; margin: 34px 0 14px; }
.pods { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.pod { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 8px; align-content: start; }
.pod h3 { font-size: 21px; margin: 2px 0 0; }
.pod p { margin: 0; }
.pod .by { color: var(--red); font-weight: 600; font-size: 14px; }
.pod-top { display: flex; gap: 6px; flex-wrap: wrap; }
.pod .btns { margin-top: 6px; }
.eps .ep { grid-template-columns: minmax(0, 340px) 1fr; }
.yt, .ytf, .pod-art { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; border: 0; display: block; }
.yt { position: relative; padding: 0; cursor: pointer; overflow: hidden; background: #6f1c0e; }
.yt img { width: 100%; height: 100%; object-fit: cover; display: block; }
.yt b, .pod-art b { position: absolute; left: 10px; top: 8px; font-family: var(--font-display); font-weight: 800; font-size: 26px; color: #fff; background: var(--grad); border-radius: 10px; padding: 2px 12px; }
.yt span, .pod-art span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font-size: 22px; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
.yt:hover span, .pod-art:hover span { transform: translate(-50%, -50%) scale(1.06); }
.pod-art { position: relative; overflow: hidden; text-decoration: none; background: linear-gradient(135deg, #2a1410, #761b0d 60%, #c8361b); }
.pod-art::after { content: ""; position: absolute; width: 70%; height: 60%; right: -18%; bottom: -25%; border-radius: 50%; background: rgba(255,140,60,.25); transform: rotate(-30deg); }
.pod-art i { position: absolute; left: 14px; bottom: 12px; font-style: normal; font-family: var(--font-display); font-weight: 800; font-size: 22px; color: #fff; z-index: 1; }
@media (max-width: 760px) { .eps .ep { grid-template-columns: 1fr; } }
.eps { display: grid; gap: 12px; }
.ep { display: grid; grid-template-columns: 120px 1fr; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; align-items: start; }
@media (max-width: 600px) { .ep { grid-template-columns: 1fr; } .ep-art { display: none !important; } }
.ep-art { aspect-ratio: 16/10; border-radius: 10px; background: linear-gradient(135deg, #962513, #761b0d); display: grid; place-items: center; }
.ep-art { position: relative; }
.ep-art b { position: absolute; left: 10px; top: 6px; font-family: var(--font-display); font-weight: 800; font-size: 28px; color: #ffcd96; }
.sec-row { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-top: 34px; }
.sec-row .sec-h { margin: 0; }
.ep-art span { width: 42px; height: 42px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font-size: 16px; }
.ep-body { display: grid; gap: 8px; }
.ep-body h3 { font-size: 21px; font-weight: 800; }
.ep-body p { margin: 0; color: #4a2a20; }
.tl { font-weight: 700; font-size: 15px; }
.news.last { padding-bottom: 64px; }

nav.main a.navcta { background: #fff; color: var(--brand); }
nav.main a.navcta[aria-current="page"] { background: #fff; color: var(--red); }
.btn.white { background: #fff; color: var(--red); }
.news-head .btns { margin-top: 8px; }
.band { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--grad); color: #fff; border-radius: 16px; padding: 20px 24px; text-decoration: none; margin-bottom: 56px; }
.band b { font-family: var(--font-display); font-size: 20px; display: block; }
.stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 880px) { .stages { grid-template-columns: 1fr; } .apply { grid-template-columns: 1fr !important; } }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 10px; align-content: start; position: relative; overflow: hidden; }
.stage::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--grad); }
.srange { font-family: var(--font-display); font-weight: 800; font-size: 22px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; width: max-content; font-variant-numeric: tabular-nums; }
.stage h3 { font-size: 22px; font-weight: 800; }
.stage p { margin: 0; color: #4a2a20; }
.stage .chip { text-decoration: none; }
.incl { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.inc { display: grid; grid-template-columns: auto 1fr; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.inc .n { font-family: var(--font-display); font-weight: 800; color: var(--red); font-size: 18px; }
.inc h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
.inc p { margin: 0; color: var(--muted); font-size: 15.5px; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; counter-reset: st; }
.steps li { counter-increment: st; background: var(--surface-2); border-radius: 14px; padding: 16px 18px; display: grid; gap: 4px; }
.steps li::before { content: counter(st); width: 32px; height: 32px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font-weight: 800; margin-bottom: 6px; }
.steps b { font-size: 17px; }
.steps span { color: var(--muted); font-size: 15px; }
.apply { display: grid; grid-template-columns: 1fr 1.1fr; gap: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px; margin: 34px 0 64px; scroll-margin-top: 80px; }
.apply h2 { font-size: 30px; font-weight: 800; margin: 6px 0 10px; }
.apply p { margin: 0 0 10px; color: #4a2a20; }
.apply .for { color: var(--muted); font-size: 15px; }
.aform { display: grid; gap: 6px; }
.aform label { font-weight: 700; font-size: 14px; margin-top: 6px; }
.aform input, .aform select, .aform textarea { border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; background: var(--bg); width: 100%; }
.aform input:focus, .aform select:focus, .aform textarea:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(236,143,53,.2); }
.aform .btn { margin-top: 10px; }
.hero.home { padding-top: 64px; padding-bottom: 56px; }
.hero.home h1 { max-width: 16ch; font-size: clamp(36px, 6vw, 64px); }
.hero.home .btns { margin-top: 10px; }
.btn.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.8); }
.mentor-band { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; background: var(--brand); color: #fff; border-radius: 20px; padding: 28px; margin-top: 34px; }
.mentor-band .eyebrow { color: #ffcd96; }
.mentor-band h2 { font-size: 28px; font-weight: 800; margin: 6px 0 8px; }
.mentor-band p { margin: 0; color: #ffe2d2; max-width: 60ch; }
@media (max-width: 700px) { .mentor-band { grid-template-columns: 1fr; } }
.res { margin-top: 34px; display: grid; gap: 14px; }
.res h2 { font-size: 26px; font-weight: 800; margin-top: 4px; }
.res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.res-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; text-decoration: none; color: var(--text); display: grid; gap: 4px; }
.res-card b { font-family: var(--font-display); font-size: 19px; }
.res-card span { color: var(--muted); font-size: 15px; }
.res-card:hover { border-color: var(--orange); }
.incl.why { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 700px) { .incl.why { grid-template-columns: 1fr; } }
.stage .srange { width: auto; font-size: 19px; line-height: 1.2; }
@media (max-width: 1320px) { .brand small { display: none; } }
@media (max-width: 760px) { nav.main a { padding: 6px 10px; font-size: 15px; } }
.player video { position: relative; z-index: 1; }
.player .poster { z-index: 0; }
.player.novid video { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
/* ---------- Capa dinámica ---------- */
html { scroll-behavior: smooth; }
.progress { position: fixed; left: 0; top: 0; height: 3px; width: 100%; background: linear-gradient(90deg, #ffd29e, #fff); transform-origin: 0 50%; transform: scaleX(0); z-index: 20; pointer-events: none; }

header.top { transition: box-shadow .3s, background-color .3s; }
header.top .wrap { transition: min-height .3s; }
header.top.scrolled { box-shadow: 0 8px 30px rgba(120, 25, 10, .25); }
header.top.scrolled .wrap { min-height: 56px; }
nav.main a { transition: background-color .2s, color .2s, transform .2s; }
nav.main a:hover { transform: translateY(-1px); }

/* Degradado vivo en las cabeceras */
.hero, .news-head {
  background: linear-gradient(120deg, #ee9a3c 0%, #e8702e 25%, #dd4a25 50%, #b9311a 75%, #ee9a3c 100%);
  background-size: 300% 300%;
  animation: gradShift 16s ease-in-out infinite alternate;
  position: relative; overflow: hidden; isolation: isolate;
}
@keyframes gradShift { from { background-position: 0% 40%; } to { background-position: 100% 60%; } }

/* Formas del icono flotando */
.hero > .blobs, .news-head > .blobs { position: absolute; inset: 0; z-index: -1; pointer-events: none; max-width: none; }
.blobs span { position: absolute; display: block; will-change: transform; }
.blobs .b1 { width: 520px; height: 250px; right: -120px; bottom: -90px; border-radius: 50%; background: linear-gradient(135deg, rgba(255,214,160,.35), rgba(165,43,23,.35)); transform: rotate(-38deg); animation: floatA 14s ease-in-out infinite alternate; }
.blobs .b2 { width: 300px; height: 300px; right: 18%; top: -120px; background: linear-gradient(160deg, rgba(255,226,190,.32), rgba(255,255,255,0)); clip-path: polygon(0 0, 44% 0, 73% 17%, 15% 62%, 0 9%); animation: floatB 18s ease-in-out infinite alternate; }
.blobs .b3 { width: 90px; height: 90px; left: 58%; bottom: 14%; border-radius: 50%; background: rgba(255,240,225,.18); animation: floatC 10s ease-in-out infinite alternate; }
@keyframes floatA { from { transform: rotate(-38deg) translate(0, 0); } to { transform: rotate(-30deg) translate(-40px, -30px); } }
@keyframes floatB { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(-60px, 40px) rotate(12deg); } }
@keyframes floatC { from { transform: translate(0, 0) scale(1); } to { transform: translate(30px, -40px) scale(1.25); } }

/* Titular con frase que cambia */
.hero.home h1 { max-width: 18ch; }
.rot { display: grid; margin-top: .08em; }
.rot > span { grid-area: 1 / 1; width: max-content; max-width: 100%; color: #fff; background: rgba(120, 24, 10, .28); border-radius: .18em; padding: 0 .22em; box-decoration-break: clone; -webkit-box-decoration-break: clone; animation: wordIn .6s cubic-bezier(.2,.8,.2,1) both; }
.rot > span.out { animation: wordOut .5s ease both; }
@keyframes wordIn { from { opacity: 0; transform: translateY(.6em) rotateX(40deg); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes wordOut { to { opacity: 0; transform: translateY(-.5em); filter: blur(4px); } }

/* Cinta de temas */
.marquee { margin: 0 calc(50% - 50vw); background: var(--brand); color: #fff; overflow: hidden; padding: 14px 0; border-top: 1px solid rgba(255,255,255,.12); }
.mq-track { display: flex; gap: 0; width: max-content; animation: marquee 38s linear infinite; }
.marquee:hover .mq-track { animation-play-state: paused; }
.mq-track span { font-family: var(--font-display); font-weight: 800; font-size: 20px; white-space: nowrap; padding: 0 22px; display: inline-flex; align-items: center; gap: 22px; }
.mq-track span::after { content: "✦"; color: #ffb36b; font-size: 14px; }
@keyframes marquee { to { transform: translateX(-50%); } }

/* Entrada al cambiar de sección */
#app.enter { animation: pageIn .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* Tarjetas: elevación y luz que sigue al cursor */
.card, .res-card, .stage, .inc, .story, .ep, .steps li, .panel { position: relative; transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s; }
.card::after, .res-card::after, .stage::after, .inc::after, .story::after, .ep::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(320px circle at var(--mx, 50%) var(--my, 50%), rgba(236, 143, 53, .16), transparent 60%);
}
.card:hover::after, .res-card:hover::after, .stage:hover::after, .inc:hover::after, .story:hover::after, .ep:hover::after { opacity: 1; }
.res-card:hover, .stage:hover, .inc:hover, .story:hover, .ep:hover, .steps li:hover { transform: translateY(-4px); box-shadow: 0 14px 34px rgba(165, 43, 23, .14); }

/* Etapas: línea de recorrido animada */
.stages { position: relative; }
.stage::before { background: linear-gradient(90deg, #ec8f35, #da3a22, #ec8f35); background-size: 200% 100%; animation: flow 3.5s linear infinite; }
@keyframes flow { to { background-position: 200% 0; } }

/* Pasos: número que late */
.steps li::before { transition: transform .3s; }
.steps li:hover::before { transform: scale(1.15) rotate(-8deg); }

/* Botones con brillo */
.btn { position: relative; overflow: hidden; transition: transform .2s, box-shadow .2s; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(165, 43, 23, .22); }
.btn.primary::after, .btn.white::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); transform: skewX(-20deg); transition: left .6s; }
.btn.primary:hover::after, .btn.white:hover::after { left: 120%; }
nav.main a.navcta { animation: pulse 3.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.55); } 50% { box-shadow: 0 0 0 7px rgba(255,255,255,0); } }

/* Aparición al hacer scroll (solo donde el navegador lo soporta; si no, todo se ve igual, sin animar) */
@supports (animation-timeline: view()) {
  .card, .res-card, .stage, .inc, .story, .ep, .steps li, .mentor-band, .apply, .feat, .sec-h, .panel, .tpl {
    animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 40%;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(46px) scale(.97); } to { opacity: 1; transform: none; } }
}

.mentor-band { background: linear-gradient(120deg, #a52b17, #7c1d0e, #a52b17); background-size: 200% 200%; animation: gradShift 12s ease-in-out infinite alternate; position: relative; overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .hero, .news-head, .mentor-band, .mq-track, .blobs span, .stage::before, nav.main a.navcta, #app.enter { animation: none !important; }
  .card, .res-card, .stage, .inc, .story, .ep, .steps li, .mentor-band, .apply, .feat, .sec-h, .panel, .tpl { animation: none !important; }
}

</style>
</head>

<script id="tools-data" type="application/json">{"tools":[{"slug":"01_identificacion_necesidad","n":1,"name":"Identificación de la necesidad","ph":0,"para":"Detectar qué cambia en tu entorno y encontrar ahí una necesidad real.","blocks":["Tendencias demográficas","Regulación","Entorno económico","Competidores","Tendencias tecnológicas","Necesidades de cliente","Incertidumbre"],"cuando":"Al arrancar, antes de tener producto. Y revísala cada año.","guion":["Identificación de la necesidad. Antes de pensar en tu producto, mira el mundo que lo rodea.","Esta herramienta sirve para detectar qué está cambiando en tu entorno y encontrar ahí una necesidad real, en lugar de partir de una idea que solo te gusta a ti.","Se usa como un mapa con siete zonas alrededor de tu empresa: tendencias demográficas, regulación, entorno económico, competidores, tendencias tecnológicas, necesidades de cliente e incertidumbres. En cada zona apunta cambios concretos, con datos y fuentes. Después busca dónde se cruzan varios cambios: ahí suele esconderse la oportunidad.","¿Cuándo usarla? Al principio de todo, en la fase de exploración, antes de tener producto. Y vuelve a ella cada año para comprobar que tu negocio sigue respondiendo a una necesidad viva."]},{"slug":"02_tendencias_consumo","n":2,"name":"Consumer Trend Canvas","ph":0,"para":"Convertir una tendencia de consumo en una idea de innovación para tu negocio.","blocks":["Necesidades básicas","Drivers de cambio","Inspiración","Expectativas emergentes","Tipo de innovación","¿A quién?","Tu innovación"],"cuando":"Explorando ideas, o cuando quieres renovar una oferta que ya existe.","guion":["Sirve para coger una tendencia que ves en la calle o en las noticias y convertirla en una idea de negocio concreta. No basta con decir que algo está de moda: hay que entender por qué y qué significa para ti.","Tiene dos partes. Primero analizas: qué necesidad profunda cubre la tendencia, qué está cambiando para que surja ahora, cómo la aplican otras empresas y qué nuevas expectativas crea en los consumidores. Después aplicas: qué tipo de innovación harías, para qué nuevo grupo de clientes, y lo resumes en tu propia innovación.","Úsalo en la fase de exploración, cuando buscas ideas, o más adelante, cuando quieras renovar una oferta que ya tienes en el mercado."]},{"slug":"03_tecnologia_disruptiva","n":3,"name":"Tecnología disruptiva","ph":0,"para":"Comparar varias ideas y puntuar su potencial disruptivo del 1 al 10.","blocks":["Desirability","Feasibility","Viability","Potencial disruptivo","Idea 1 … Idea 6"],"cuando":"Cuando tienes varias ideas y debes elegir en cuál apostar.","guion":["Sirve para comparar varias ideas o innovaciones y decidir cuál tiene más potencial de cambiar las reglas del juego, en vez de quedarte con la primera que se te ocurrió.","Pones hasta seis ideas en filas y las valoras con tres criterios. Deseabilidad: ¿resuelve un problema importante y creciente del cliente? Factibilidad: ¿es mucho mejor que lo que existe? Y viabilidad: ¿es mucho más barata y permite nuevos modelos de negocio? Puntúa cada una del uno al diez y suma: el total es su potencial disruptivo.","Úsala cuando tienes varias ideas sobre la mesa y debes elegir en cuál apostar tu tiempo. Es un filtro rápido antes de invertir en validar."]},{"slug":"04_mapa_empatia","n":4,"name":"Mapa de empatía","ph":1,"para":"Ponerte en la piel de tu cliente: qué piensa, siente, ve, oye, dice y hace.","blocks":["¿Con quién empatizamos?","Objetivo","¿Qué ve?","¿Qué escucha?","¿Qué dice?","¿Qué hace?","¿Qué piensa y siente?","Pains","Gains"],"cuando":"Antes y después de entrevistar a clientes potenciales.","guion":["Sirve para ponerte de verdad en la piel de tu cliente. No para describir lo que tú crees que necesita, sino para entender cómo vive su situación.","Empieza definiendo con quién empatizas y qué necesita conseguir. Después rellena qué ve en su entorno, qué escucha de amigos y referentes, qué dice y qué hace realmente. En el centro, qué piensa y siente. Y para cerrar, sus pains, es decir, miedos y frustraciones, y sus gains, sus deseos y sueños. Separa lo que has observado de lo que imaginas.","¿Cuándo? En cuanto tengas un segmento de cliente en mente. Úsalo para preparar entrevistas y vuelve a rellenarlo después, con lo que has aprendido."]},{"slug":"05_personas","n":5,"name":"Personas · Público objetivo","ph":1,"para":"Dar cara y nombre a tu cliente ideal para tomar mejores decisiones.","blocks":["Foto y nombre","Edad · Sexo · Ocupación","Localización · Ingresos","Educación","Objetivos","Motivaciones","Frustraciones","Aficiones","Marcas que le gustan","Dispositivos"],"cuando":"Tras las primeras entrevistas, antes de diseñar producto y marketing.","guion":["Sirve para dar cara y nombre a tu cliente ideal. Cuando el equipo comparte la misma persona en la cabeza, las decisiones de producto, precio y comunicación son mucho más fáciles.","Rellena una ficha como si fuera alguien real: foto, edad, ocupación, dónde vive, ingresos y formación. Luego lo importante: sus objetivos, sus motivaciones y sus frustraciones. Y termina con aficiones, marcas que le gustan y qué dispositivos usa. Basa cada dato en entrevistas, no en suposiciones, y haz una ficha por cada tipo de cliente.","Úsala después de tus primeras entrevistas y antes de diseñar el producto o la campaña de marketing. Tenla siempre a mano en las reuniones."]},{"slug":"06_value_proposition_canvas","n":6,"name":"Value Proposition Canvas","ph":2,"para":"Formular en una frase qué valor das, a quién y en qué te diferencias.","blocks":["Nuestros productos y servicios","ayudan a… (verbo)","segmento de cliente","que quieren… (jobs to be done)","a diferencia de… (alternativa)"],"cuando":"Cuando ya conoces al cliente y necesitas explicar tu solución.","guion":["Sirve para resumir en una sola frase qué ofreces, a quién y por qué eres diferente. Si no sabes decirlo en una frase, tu cliente tampoco lo va a entender.","La plantilla es una frase con huecos. Nuestros productos y servicios, ayudan a, y aquí un verbo, a tal segmento de cliente, que quieren conseguir tal tarea o resultado, a diferencia de la alternativa que usan hoy. Prueba varias versiones, léelas en voz alta y quédate con la más clara y concreta. Después, contrástala con clientes reales.","Úsala cuando ya has entendido al cliente con el mapa de empatía y la ficha de Personas, y antes de construir tu modelo de negocio o tu pitch."]},{"slug":"07_matriz_competencia","n":7,"name":"Matriz de competencias","ph":2,"para":"Compararte con tu competencia en los puntos que te hacen diferente.","blocks":["Nuestra empresa","Competidor 2","Competidor 3","Competidor 4 …","Propuesta diferencial 1","Propuesta diferencial 2","Propuesta diferencial 3","Propuesta diferencial 4"],"cuando":"Al definir tu propuesta y antes de presentar a inversores.","guion":["Sirve para ver de un vistazo cómo te sitúas frente a tu competencia en aquello que te hace diferente. Decir que no tienes competencia nunca es una buena señal.","En las filas pones tu empresa y hasta cinco competidores, directos o alternativos. En las columnas, tus cuatro propuestas diferenciales: precio, rapidez, sostenibilidad, experiencia, lo que te distinga. Marca o puntúa a cada uno. Si en ninguna columna destacas claramente, tu propuesta aún no es lo bastante diferente.","Úsala cuando estás definiendo tu propuesta de valor y repítela antes de presentar el proyecto a inversores o socios. Es una diapositiva casi obligatoria."]},{"slug":"08_calculo_mercado","n":8,"name":"Cálculo de mercado · TAM SAM SOM","ph":2,"para":"Estimar el tamaño real de tu oportunidad en clientes y en euros.","blocks":["TAM · mercado total","SAM · mercado que encaja contigo","SOM · mercado que puedes captar"],"cuando":"Antes de hacer tu plan financiero o buscar financiación.","guion":["Sirve para estimar el tamaño de tu oportunidad, tanto en número de clientes como en facturación. Te ayuda a saber si el negocio merece la pena y a defenderlo ante inversores.","Son tres círculos, uno dentro de otro. El TAM es el mercado total. El SAM es la parte de ese mercado que encaja con tu oferta y tu modelo de negocio. Y el SOM es la parte que de verdad puedes captar y atender en los próximos años. Calcula de abajo arriba: número de clientes por precio, y deja escritas tus fuentes y supuestos.","Úsalo cuando ya tienes clara la propuesta y la competencia, y siempre antes de hacer tu plan financiero o de salir a buscar financiación."]},{"slug":"09_business_model_canvas","n":9,"name":"Business Model Canvas","ph":3,"para":"Ver todo tu modelo de negocio en una sola página.","blocks":["Partners clave","Actividades clave","Recursos clave","Propuesta de valor","Relación con clientes","Canales","Segmentos de clientes","Estructura de costes","Fuentes de ingresos"],"cuando":"Cuando pasas de idea a modelo. Actualízalo tras cada aprendizaje.","guion":["Sirve para ver todo tu modelo de negocio en una sola página: cómo creas valor, cómo lo entregas y cómo ganas dinero. Es el mapa que conecta todas las demás herramientas.","Tiene nueve bloques. A la derecha, el cliente: segmentos, propuesta de valor, canales y relación con clientes. A la izquierda, la operación: actividades, recursos y partners clave. Y abajo, los números: estructura de costes y fuentes de ingresos. Rellénalo con pósits, una idea por pósit, empezando por el cliente y la propuesta de valor.","Úsalo cuando pasas de una idea a un modelo de negocio. No es un documento que se hace una vez: actualízalo después de cada experimento o conversación con clientes."]},{"slug":"10_service_blueprint","n":10,"name":"Service Blueprint","ph":3,"para":"Diseñar lo que el cliente vive y lo que tiene que pasar por detrás.","blocks":["Atracción","Compra","Uso","Valoración y recomendación","Evidencias físicas","Acciones del cliente","Línea emocional","Touchpoints","Operativa","Procesos de apoyo"],"cuando":"Antes de lanzar un piloto, para que la operación esté lista.","guion":["Sirve para definir las acciones y procesos que tienen que pasar, a nivel operativo, para que tu producto o servicio funcione. Une lo que el cliente vive con lo que tu equipo hace por detrás.","En horizontal, las fases del cliente: atracción, compra, uso, y valoración y recomendación. En vertical, las capas. Arriba, el frontstage: evidencias físicas, acciones del cliente, su línea emocional y los puntos de contacto. Abajo, el backstage: la operativa y los procesos de apoyo que el cliente no ve. Busca los momentos con emoción negativa: ahí tienes que mejorar.","Úsalo antes de lanzar tu primer piloto, para que la operación esté preparada, y cada vez que algo falle en la experiencia del cliente."]},{"slug":"11_product_market_fit","n":11,"name":"Product-Market Fit","ph":3,"para":"Alinear lo que pide el mercado con lo que ofrece tu producto.","blocks":["Problemas y necesidades ↔ Características","Madurez del mercado ↔ Alternativas","Experiencia de usuario ↔ Valor diferencial","Canales ↔ Valor añadido del canal"],"cuando":"Al diseñar tu MVP y al revisar los resultados del piloto.","guion":["Sirve para comprobar que lo que ofrece tu producto encaja con lo que de verdad pide el mercado. Sin ese encaje, ningún presupuesto de marketing te va a salvar.","La plantilla enfrenta dos columnas en cuatro parejas. Problemas y necesidades del cliente, frente a las características de tu producto. Madurez del mercado, frente a las alternativas que ya existen. La experiencia de usuario, frente a tu valor diferencial. Y los canales de compra, frente al valor que aporta tu canal. Cada pareja debe responderse con evidencias.","Úsalo cuando diseñas tu producto mínimo viable y otra vez cuando analizas los resultados del piloto. Si las columnas no encajan, toca pivotar."]},{"slug":"12_vision_futuro","n":12,"name":"Canvas de visión de futuro","ph":4,"para":"Definir hacia dónde va tu negocio y qué pasos te llevan allí.","blocks":["Visión","Grandes hitos","Apoyos","Retos","Temáticas"],"cuando":"Al formar el equipo y al empezar cada año.","guion":["Sirve para definir hacia dónde quieres llevar tu negocio y cómo vas a ayudar a tus clientes a largo plazo. Alinea al equipo y da sentido a las decisiones del día a día.","En el centro escribe la visión: cómo será tu negocio dentro de unos años. Alrededor, los grandes hitos que te acercan a ella, agrupados por temáticas, como producto, equipo o mercado. Después identifica los apoyos que te van a ayudar a conseguirlo y los retos que te lo pueden dificultar. Que sea ambiciosa, pero creíble.","Úsalo al formar el equipo fundador y al empezar cada año. Es el punto de partida para fijar tus OKRs."]},{"slug":"13_okrs","n":13,"name":"OKRs","ph":4,"para":"Convertir la visión en objetivos medibles y acciones concretas.","blocks":["Objetivo anual","Objetivo trimestral","Resultados clave","Acciones clave"],"cuando":"Cada trimestre, en cuanto tengas equipo y visión.","guion":["Sirven para convertir tu visión en objetivos medibles y en acciones concretas. Así todo el equipo sabe qué es lo más importante ahora y cómo se mide el avance.","Parte de un objetivo anual, inspirador y cualitativo. Divídelo en objetivos trimestrales. Para cada uno define resultados clave medibles, con un número y una fecha, por ejemplo cien clientes de pago en marzo. Y debajo, las acciones clave que vas a hacer para lograrlos. Pocos objetivos, como mucho tres resultados clave por cada uno.","Úsalos en cuanto tengas equipo y visión. Revísalos cada semana y fíjalos de nuevo cada trimestre."]},{"slug":"14_plan_negocio","n":14,"name":"Plan de negocio","ph":4,"para":"Proyectar ingresos y gastos para saber si el negocio se sostiene.","blocks":["Mes 1 … Mes 5","Año 2 · Año 3","Equipo","Marketing","Tecnología","Oficina y transporte","Ingresos por cliente o línea"],"cuando":"Antes de pedir financiación y para controlar tu caja.","guion":["Sirve para proyectar tus ingresos y tus gastos y saber si tu negocio se sostiene, cuánto dinero necesitas y cuándo llegarías al equilibrio.","En columnas, el tiempo: los primeros meses uno a uno, y después el año dos y el año tres. En filas, primero la estructura de gastos: personas, marketing, tecnología, servicios, oficina, transporte. Después la estructura de ingresos, por cliente o por línea de negocio. Usa los datos de tu cálculo de mercado y sé conservador con los ingresos.","Úsalo cuando ya tienes modelo de negocio y antes de pedir financiación. Y después, compáralo cada mes con la realidad para controlar tu caja."]},{"slug":"15_escenarios","n":15,"name":"Escenarios","ph":4,"para":"Preparar tu negocio para que las cosas vayan mejor o peor de lo previsto.","blocks":["Indicadores · KPIs","Escenario optimista","Escenario moderado","Escenario pesimista"],"cuando":"Junto al plan de negocio, y al revisar resultados.","guion":["Sirve para prepararte ante distintos futuros. Las cosas casi nunca salen como en el plan, así que conviene saber de antemano qué harás si van mejor o peor.","Primero define tus indicadores clave: clientes conseguidos, clientes fidelizados, ingresos, tamaño del equipo. Después describe tres escenarios, optimista, moderado y pesimista, con el valor de cada indicador en cada uno. Y lo más útil: decide qué decisiones tomarías en cada caso, por ejemplo contratar, recortar gastos o buscar financiación.","Úsala junto al plan de negocio y cada vez que revises resultados. Así sabrás pronto en qué escenario estás y podrás reaccionar a tiempo."]},{"slug":"16_riesgos","n":16,"name":"Riesgos del proyecto","ph":4,"para":"Anticipar lo que puede salir mal y cómo lo vas a mitigar.","blocks":["Producto o servicio","Venta y comercialización","Gestión de la operativa","Riesgos económico-financieros","Impacto generado"],"cuando":"Antes de lanzar un piloto y en cada revisión trimestral.","guion":["Sirve para identificar qué puede salir mal antes de que pase, y preparar cómo reducirlo. Los inversores valoran mucho a quien conoce sus riesgos.","Repasa cinco áreas: el producto o servicio, la venta y comercialización, la gestión de la operativa interna, los riesgos económico-financieros y el impacto generado. En cada una explica los riesgos principales, valora su probabilidad y su impacto, y elige una métrica para vigilarlos. Añade una acción concreta para mitigar los más graves.","Úsala antes de lanzar un piloto y revísala en cada cierre de trimestre, junto a tus OKRs y escenarios."]},{"slug":"17_impacto_positivo","n":17,"name":"Impacto positivo","ph":4,"para":"Medir el impacto social, medioambiental y económico de tu proyecto.","blocks":["Impacto social","Impacto medioambiental","Impacto económico","Positivo y negativo"],"cuando":"Desde el diseño del modelo, y al presentar a inversores de impacto.","guion":["Sirve para analizar qué huella deja tu proyecto en el mundo, más allá de la facturación. Cada vez más clientes, talento e inversores lo miran antes de decidir.","Tiene tres áreas. Impacto social: contribución local, diversidad, igualdad y apoyo a colectivos. Impacto medioambiental: residuos, huella hídrica, huella de carbono y reaprovechamiento. Impacto económico: empleo, sostenibilidad del negocio en el tiempo y riqueza para el entorno. En cada una anota el impacto positivo, pero también el negativo, con honestidad.","Úsala desde que diseñas tu modelo de negocio, no al final. Y llévala contigo cuando presentes el proyecto a inversores o a convocatorias de impacto."]},{"slug":"18_mapa_de_financiacion","n":18,"name":"Mapa de financiación","ph":4,"para":"Seleccionar subvenciones, deuda, crowdfunding o capital según necesidades y obligaciones.","blocks":["Necesidad y destino del dinero","Fuente de financiación","Requisitos y elegibilidad","Coste, garantías y dilución","Calendario y documentación","Alternativa si no se consigue"],"cuando":"Antes de pedir financiación.","guion":["Mapa de financiación. Seleccionar subvenciones, deuda, crowdfunding o capital según necesidades y obligaciones.","Empieza definiendo necesidad y destino del dinero y fuente de financiación. Escribe datos y supuestos concretos; cuando no haya evidencia, marca la hipótesis como pendiente.","Completa el resto de la ficha: requisitos y elegibilidad, coste, garantías y dilución, calendario y documentación, alternativa si no se consigue. Prioriza decisiones, cifras y responsables en lugar de texto genérico.","Ejemplo orientativo: Ejemplo: combinar 15.000 € de aportación propia, 20.000 € de subvención condicionada y 25.000 € de préstamo; verificar plazos y tesorería.","Cierra la herramienta con una decisión, un responsable y una fecha de revisión. Antes de pedir financiación. Esta ficha es un apoyo de planificación; las decisiones legales, fiscales o financieras requieren contraste profesional."],"example":"Ejemplo: combinar 15.000 € de aportación propia, 20.000 € de subvención condicionada y 25.000 € de préstamo; verificar plazos y tesorería.","worksheets":[{"label":"Necesidad y destino del dinero","prompt":"Anota el dato o la decisión que corresponde a «necesidad y destino del dinero»."},{"label":"Fuente de financiación","prompt":"Indica qué información verificable respalda este apartado y qué falta por confirmar."},{"label":"Requisitos y elegibilidad","prompt":"Anota el dato o la decisión que corresponde a «requisitos y elegibilidad»."},{"label":"Coste, garantías y dilución","prompt":"Indica qué información verificable respalda este apartado y qué falta por confirmar."},{"label":"Calendario y documentación","prompt":"Anota el dato o la decisión que corresponde a «calendario y documentación»."},{"label":"Alternativa si no se consigue","prompt":"Indica qué información verificable respalda este apartado y qué falta por confirmar."}]},{"slug":"19_tesoreria_burn_rate_y_runway","n":19,"name":"Tesorería, burn rate y runway","ph":4,"para":"Calcular el consumo de caja y anticipar cuándo habrá que captar fondos o recortar costes.","blocks":["Saldo de caja hoy","Cobros mensuales previstos","Pagos fijos y variables","Flujo neto mensual","Meses de runway","Acción preventiva y fecha"],"cuando":"Revisar cada mes y antes de incorporar gastos fijos.","guion":["Tesorería, burn rate y runway. Calcular el consumo de caja y anticipar cuándo habrá que captar fondos o recortar costes.","Empieza definiendo saldo de caja hoy y cobros mensuales previstos. Escribe datos y supuestos concretos; cuando no haya evidencia, marca la hipótesis como pendiente.","Completa el resto de la ficha: pagos fijos y variables, flujo neto mensual, meses de runway, acción preventiva y fecha. Prioriza decisiones, cifras y responsables en lugar de texto genérico.","Ejemplo orientativo: Ejemplo: 60.000 € de caja y 10.000 € de consumo neto mensual equivalen a seis meses de runway si el ritmo no cambia.","Cierra la herramienta con una decisión, un responsable y una fecha de revisión. Revisar cada mes y antes de incorporar gastos fijos. Esta ficha es un apoyo de planificación; las decisiones legales, fiscales o financieras requieren contraste profesional."],"example":"Ejemplo: 60.000 € de caja y 10.000 € de consumo neto mensual equivalen a seis meses de runway si el ritmo no cambia.","worksheets":[{"label":"Saldo de caja hoy","prompt":"Anota el dato o la decisión que corresponde a «saldo de caja hoy»."},{"label":"Cobros mensuales previstos","prompt":"Indica qué información verificable respalda este apartado y qué falta por confirmar."},{"label":"Pagos fijos y variables","prompt":"Anota el dato o la decisión que corresponde a «pagos fijos y variables»."},{"label":"Flujo neto mensual","prompt":"Indica qué información verificable respalda este apartado y qué falta por confirmar."},{"label":"Meses de runway","prompt":"Anota el dato o la decisión que corresponde a «meses de runway»."},{"label":"Acción preventiva y fecha","prompt":"Indica qué información verificable respalda este apartado y qué falta por confirmar."}]},{"slug":"20_unit_economics_cac_ltv_y_margen","n":20,"name":"Unit economics: CAC, LTV y margen","ph":3,"para":"Ver si cada cliente aporta margen suficiente para so <script id="news-data" type="application/json">{"week": "Semana del 16 al 20 de noviembre de 2026", "videoKey": "noticias-2026-11-20", "videoFile": "IA_negocios_semana_20nov2026.mp4", "items": [{"tag": "Financiación", "title": "Anthropic sale a bolsa en el Nasdaq", "body": "La creadora de Claude fijó el precio de su salida a bolsa en 83 dólares por acción, por encima del rango previsto, con una demanda de unas seis veces la oferta. Eso la valora en torno a 1,5 billones de dólares y la sitúa entre las mayores salidas a bolsa de la historia. Empezó a cotizar el jueves 19 de noviembre.", "lesson": "El capital sigue apostando fuerte por la IA. Si tu proyecto la usa para resolver un problema concreto, hoy es más fácil explicar por qué el mercado es grande.", "tool": "08_calculo_mercado", "sources": [["The Next Web", "https://thenextweb.com/news/anthropic-ipo-prices-83-share-1-5-trillion-record-raise"], ["AI Weekly (CNBC)", "https://aiweekly.co/alerts/anthropic-prices-ipo-at-83-above-range-trades-thursday-as-ant"]]}, {"tag": "Liderazgo", "title": "Nvidia cambia de CEO y aun así bate récords", "body": "Jensen Huang dimitió el 12 de noviembre tras 33 años al frente, en medio de una investigación del consejo. La directora financiera, Colette Kress, es la consejera delegada interina. Cinco días después, Nvidia presentó unos ingresos trimestrales de 115.800 millones de dólares, un 103 % más que hace un año.", "lesson": "Depender de una sola persona es un riesgo, incluso en la empresa más valiosa del sector. Inclúyelo en tu análisis de riesgos.", "tool": "16_riesgos", "sources": [["TechCrunch", "https://techcrunch.com/?p=3187751"], ["Stock Analysis", "https://stockanalysis.com/news/nvda-q3-fy2027-earnings-beat/"]]}, {"tag": "Producto", "title": "OpenAI lanza GPT-6.2 Astra y Sol", "body": "Son dos modelos nuevos pensados para el trabajo profesional, con menos coste de computación para tareas complejas. Llegan dos semanas después de que GPT-6 Sol y Luna rebajaran precios a la mitad.", "lesson": "Lo que hace un año era caro de automatizar hoy cuesta mucho menos. Vuelve a puntuar la viabilidad de tus ideas.", "tool": "03_tecnologia_disruptiva", "sources": [["The Neuron", "https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-wednesday-november-18-2026/"], ["Anicca", "https://anicca.co.uk/?p=63488"]]}, {"tag": "Producto", "title": "Google abre Gemini 4 Carbon a su API de pago", "body": "El modelo, antes limitado a un programa de ciberseguridad, ya está disponible en Google AI Studio y en Gemini para empresas, con un precio de lanzamiento de 2 dólares por millón de tokens de entrada y 10 de salida hasta el 30 de noviembre.", "lesson": "Los precios de lanzamiento son una ventana para prototipar barato. Aprovéchala para tu producto mínimo viable.", "tool": "11_product_market_fit", "sources": [["OpenTools", "https://opentools.ai/news/rezolve-ai-gears-up-to-revolutionize-retail-with-trumps-dollar500-billion-stargate-ai-initiative"]]}, {"tag": "Organización", "title": "Cognizant reorganiza a 68.000 personas por plataforma de IA", "body": "La consultora ha dividido a 68.000 empleados en unidades especializadas en Claude, OpenAI y Gemini, apostando por la especialización para ganar contratos de implantación de IA en empresas.", "lesson": "Especializarse en un nicho claro es una propuesta de valor. Defínela en una frase.", "tool": "06_value_proposition_canvas", "sources": [["OpenTools", "https://opentools.ai/news/building-the-future-why-robust-it-infrastructure-is-key-to-ai-success"]]}, {"tag": "Marketing", "title": "ChatGPT abre perfiles de empresa y agentes de marca", "body": "OpenAI ha lanzado en beta un espacio para que las empresas verifiquen su presencia en ChatGPT, consulten métricas de visibilidad y creen agentes que atienden a posibles clientes.", "lesson": "Tus clientes ya preguntan a la IA antes de comprar. Revisa tus canales: ¿apareces ahí?", "tool": "09_business_model_canvas", "sources": [["MarketingProfs", "https://www.marketingprofs.com/opinions/2026/56258/ai-update-november-13-2026-ai-news-and-views-from-the-past-week"]]}, {"tag": "Startups", "title": "LangChain alcanza una valoración de 3.000 millones", "body": "La startup de herramientas para crear agentes de IA declara 7.000 clientes de LangSmith, su plataforma para probar y vigilar agentes, según TechCrunch.", "lesson": "Las herramientas que ayudan a otros a construir crecen con toda la ola. Piensa en qué necesita tu cliente para usar una tecnología nueva.", "tool": "02_tendencias_consumo", "sources": [["AIToolly", "https://aitoolly.com/ai-news/2026-11-14"]]}, {"tag": "Mercado", "title": "Gartner prevé que el mercado de plataformas de IA crezca un 63 % en 2026", "body": "La consultora estima que el mercado mundial de plataformas y modelos de IA crecerá un 63,4 % este año, con la IA generativa creciendo más rápido que el resto.", "lesson": "Un mercado que crece así deja huecos para muchos nichos. Detecta cuál encaja con una necesidad que conoces bien.", "tool": "01_identificacion_necesidad", "sources": [["The Missing Link", "https://www.themissinglink.com.au/news/the-neural-link-edition-17"]]}]}</script>

os 'no'.","tool":"01_identificacion_necesidad","url":"https://www.npr.org/2016/10/17/497820565/airbnb-joe-gebbia"},{"title":"Costco","show":"Acquired","lang":"EN","why":"Un modelo de negocio poco común explicado a fondo: cuotas de socio, márgenes mínimos y un surtido muy corto.","tool":"09_business_model_canvas","url":"https://www.acquired.fm/episodes/costco"},{"title":"Cómo pasar de emprendedor a empresario sin errores","show":"Spicy4tuna","lang":"ES","why":"Qué cambia cuando dejas de hacerlo todo tú: delegar, ordenar el negocio y fijar objetivos.","tool":"13_okrs","url":"https://poderato.com/shows/spicy4tuna/c-mo-pasar-de-emprendedor-a-empresario-sin-errores-extraspicy"},{"title":"Brian Chesky's new playbook","show":"Lenny's Podcast","lang":"EN","why":"El CEO de Airbnb explica cómo dirige la empresa, cómo prioriza y por qué el fundador debe estar cerca del producto.","tool":"12_vision_futuro","url":"https://www.lennysnewsletter.com/p/brian-cheskys-contrarian-approach"}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("tools-data").textContent);
const NEWS = JSON.parse(document.getElementById("news-data").textContent);
const TOOLS = DATA.tools, PHASES = DATA.phases;
const LEARN = JSON.parse(document.getElementById("learn-data").textContent);
const app = document.getElementById("app");
const state = { phase: null, q: "", videos: {}, db: null, assets: null };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hashOf = t => "h-" + t.slug.replace(/_/g, "-");
const bySlug = Object.fromEntries(TOOLS.map(t => [t.slug, t]));
const pad = n => String(n).padStart(2, "0");

function videoSrc(key) { const v = state.videos[key]; return v && v.assetId ? "/_blob/" + v.assetId : null; }

function setNav(name) {
  document.querySelectorAll("nav.main a").forEach(a => { if (a.dataset.nav === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
}

function adminBlock() { return "";

  return `<section class="admin" id="admin" hidden>
    <h2>Subir los vídeos de las píldoras</h2>
    <p>Solo lo ves tú como editor. Descarga los MP4 de ElevenLabs y arrástralos aquí todos a la vez: cada archivo se coloca en su herramienta por su nombre (Pildora_01_…mp4) y el resumen de noticias por IA_negocios_semana_….mp4.</p>
    <label class="drop" id="drop" for="file-in">Arrastra aquí los MP4 o haz clic para elegirlos</label>
    <input class="sr" type="file" id="file-in" accept="video/mp4" multiple>
    <div class="log" id="log" aria-live="polite"></div>
  </section>`;
}

function renderLibrary() {
  setNav("herramientas");
  const counts = PHASES.map((_, i) => TOOLS.filter(t => t.ph === i).length);
  const withVideo = TOOLS.filter(t => videoSrc(t.slug)).length;
  app.innerHTML = `
  <section class="hero"><div class="hero-in">
    <span class="eyebrow">Recursos gratuitos</span>
    <h1>Las herramientas que usamos con nuestros emprendedores</h1>
    <p>Plantillas descargables para cada fase de tu proyecto: para qué sirve cada una, cómo se usa y cuándo te conviene.</p>
    <div class="route" role="group" aria-label="Filtrar por fase">
      ${PHASES.map((p, i) => `<button type="button" data-ph="${i}" aria-pressed="${state.phase === i}"><span class="dot">${i + 1}</span><span class="nm">${esc(p)}</span></button>`).join("")}
    </div>
  </div></section>
  ${adminBlock()}
  <div class="toolbar">
    <label class="search" for="q"><span aria-hidden="true">⌕</span><span class="sr">Buscar herramienta</span><input id="q" type="search" placeholder="Busca: clientes, mercado, OKR, riesgos…" value="${esc(state.q)}"></label>
  </div>
  <div class="grid" id="grid"></div>
  <a class="band" href="#solicitar"><span><b>Las herramientas ayudan. Un consejo asesor de emprendedores que ya lo han vivido, mucho más.</b></span><span class="btn white">Monta tu consejo asesor →</span></a>`;
  drawGrid();
  app.querySelectorAll(".route button").forEach(b => b.onclick = () => { const i = +b.dataset.ph; state.phase = state.phase === i ? null : i; renderLibrary(); });
  const q = document.getElementById("q");
  q.oninput = () => { state.q = q.value; drawGrid(); };
  wireAdmin();
}

function drawGrid() {
  const q = state.q.trim().toLowerCase();
  const list = TOOLS.filter(t => (state.phase === null || t.ph === state.phase) &&
    (!q || (t.name + " " + t.para + " " + t.blocks.join(" ") + " " + t.guion.join(" ")).toLowerCase().includes(q)));
  document.getElementById("grid").innerHTML = list.length ? list.map(t => `
    <a class="card" href="#${hashOf(t)}">
      <span class="num"><span>${pad(t.n)}</span></span>
      <h3>${esc(t.name)}</h3>
      <p>${esc(t.para)}</p>
      <span class="chips"><span class="chip phase">Fase ${t.ph + 1} · ${esc(PHASES[t.ph])}</span><span class="chip">${t.worksheets ? "Plantilla imprimible" : "Plantilla PDF"}</span></span>
    </a>`).join("") : `<p>No hay herramientas con «${esc(state.q)}». Prueba con otra palabra o quita el filtro de fase.</p>`;
}

function renderTool(t) {
  setNav("herramientas");
  const i = TOOLS.indexOf(t), prev = TOOLS[i - 1], next = TOOLS[i + 1];
  const src = videoSrc(t.slug);
  app.innerHTML = `
  <article class="detail">
    <div class="crumbs"><a href="#herramientas">← Herramientas</a> · <a href="/guias.html">Guías para emprender</a></div>
    <div class="dhead"><span class="eyebrow">Fase ${t.ph + 1} · ${esc(PHASES[t.ph])}</span><h1>${esc(t.name)}</h1></div>
    <div class="layout">
      <div style="display:grid;gap:20px">

        <section class="panel guion" aria-labelledby="g-h"><h2 id="g-h">En pocas palabras</h2>${t.guion.map(p => `<p>${esc(p)}</p>`).join("")}</section>
      </div>
      <aside class="side">
        <section class="panel"><h2>¿Para qué sirve?</h2><p class="big">${esc(t.para)}</p></section>
        <section class="panel"><h2>¿Cómo se usa?</h2><div class="blocks">${t.blocks.map(b => `<span>${esc(b)}</span>`).join("")}</div></section>
        <section class="panel"><h2>¿Cuándo usarla?</h2><p class="big">${esc(t.cuando)}</p><div class="minroute" aria-hidden="true">${PHASES.map((_, k) => `<span class="${k === t.ph ? "on" : ""}"></span>`).join("")}</div><small>Fase ${t.ph + 1} de 5: ${esc(PHASES[t.ph])}</small></section>
        <section class="panel tpl"><h2>Plantilla de trabajo</h2>
          ${t.worksheets ? `<p>Hoja práctica con apartados guiados, espacio para tus respuestas y un ejemplo orientativo.</p><button class="btn primary" type="button" data-print-template="${esc(t.slug)}">Abrir plantilla e imprimir / guardar PDF</button><p><small>Desde la ventana de impresión, elige «Guardar como PDF». La plantilla incluye campos para completar a mano.</small></p>` : `<img src="${tplFile(t, "jpg")}" alt="Vista previa de la plantilla ${esc(t.name)}" loading="lazy"><a class="btn primary" href="${tplFile(t, "pdf")}" download>Descargar plantilla (PDF)</a>`}
          <small class="dlmsg" id="dlmsg" aria-live="polite"></small>
        </section>
      </aside>
    </div>
    <nav class="pager" aria-label="Otras herramientas">
      ${prev ? `<a href="#${hashOf(prev)}"><small>← Anterior</small>${esc(prev.name)}</a>` : "<span></span>"}
      ${next ? `<a class="next" href="#${hashOf(next)}"><small>Siguiente →</small>${esc(next.name)}</a>` : "<span></span>"}
    </nav>
  </article>`;
  app.querySelectorAll("[data-dl]").forEach(b => b.onclick = () => downloadTpl(bySlug[b.dataset.dl]));
  app.querySelectorAll("[data-print-template]").forEach(b => b.onclick = () => printWorksheet(bySlug[b.dataset.printTemplate]));
  window.scrollTo(0, 0);
}

function printWorksheet(t) {
  if (!t || !t.worksheets) return;
  const popup = window.open("", "_blank");
  if (!popup) { alert("Permite las ventanas emergentes para abrir la plantilla."); return; }
  const e = esc;
  const layouts = {
    canvas: [18,27,29,33,34,42],
    matrix: [19,20,23,24,28,31,35,37,40,44],
    checklist: [22,25,26,36,38],
    flow: [21,30,32,39,41,43]
  };
  const kind = Object.keys(layouts).find(k => layouts[k].includes(t.n)) || "canvas";
  const prompts = {
    18:["¿Qué importe necesitas y para qué hito?","¿Qué alternativas puedes combinar?","¿Qué condiciones debes cumplir?","¿Qué coste total y cesión de control implica?","¿Qué plazos y documentos necesitas?","¿Qué harás si no llega a tiempo?"],
    19:["Caja disponible hoy (€)","Cobros previstos por mes (€)","Pagos fijos y variables (€)","Cobros - pagos (€)","Caja ÷ consumo neto mensual, si este es positivo","Responsable, alerta y fecha de actuación"],
    20:["Ingreso medio por cliente y periodo","Coste variable por cliente y periodo","Ingresos menos costes variables","Gasto de adquisición ÷ clientes nuevos","Duración y frecuencia de compra verificadas","Valor de vida y plazo para recuperar el CAC"],
    21:["¿Cuánto se solicita y para qué objetivo?","¿Qué objetivos demostrables financiará?","¿Cómo se distribuye el capital?","¿Qué perfiles de inversor encajan?","¿Qué hitos y reuniones hay en cada mes?","¿Qué alternativa existe si la ronda no cierra?"],
    22:["¿Qué problema concreto resuelves?","¿Qué has probado que funciona?","¿Cuál es el mercado accesible?","¿Qué evolución muestran las métricas?","¿Cómo ganas dinero?","¿Quién ejecuta el proyecto?","¿Cuánto capital pides y en qué se usará?"],
    23:["Nombre del socio y número de títulos","Valor de la sociedad antes de invertir (€)","Capital nuevo que entra (€)","Valoración pre-money + inversión (€)","Títulos nuevos emitidos","Porcentaje tras la emisión y posibles opciones"],
    24:["¿Qué instrumento y valoración se proponen?","¿Qué cobro prioritario se pacta?","¿Qué decisiones requieren consentimiento?","¿Cómo se protege frente a futuras rondas?","¿Qué compromisos de permanencia existen?","¿Qué debe suceder para cerrar?"],
    25:["Escrituras, estatutos y libro de socios","Balances, impuestos y deuda","Contratos clave y facturación","Marcas, software y protección de datos","Contratos laborales y compromisos","Litigios, contingencias y documentos pendientes"],
    26:["Entidad convocante y enlace a las bases","¿Puede concurrir la organización?","¿Qué gastos son financiables?","¿Qué fondos propios hacen falta?","Fecha límite, resolución y justificación","¿Qué pasa si la ayuda no se concede?"],
    27:["¿Preventa, donación o inversión?","¿Qué comunidad existe hoy?","¿Qué recibe quien apoya?","¿Qué objetivo neto necesitas?","¿Cómo generarás visitas y conversiones?","¿Cómo cumplirás las entregas?"],
    28:["Contacto y tesis de inversión","Importe y fase habitual","Encaje real con tu proyecto","¿Quién puede presentaros?","Estado documentado del proceso","Fecha y acción de seguimiento"],
    29:["¿Qué problema y qué colectivo atiendes?","¿Qué cambio social esperas conseguir?","¿Qué ingresos recurrentes sostendrán el servicio?","¿Qué capital encaja con el impacto?","¿Qué resultados reportarás?","¿Cómo protegerás la misión?"],
    30:["¿Qué situación quieres cambiar?","¿Para quién debe cambiar?","¿Qué recursos y acciones activarás?","¿Qué logros inmediatos observarás?","¿Qué cambio sostenido esperas?","¿Qué hipótesis pueden fallar?"],
    31:["¿Qué población medirás?","¿Qué resultado cambia?","¿Cuál es el punto de partida?","¿Qué meta y plazo son realistas?","¿Cómo recopilarás datos?","¿Quién revisa resultados y posibles daños?"],
    32:["¿Qué proceso se analiza?","¿Cuál es el tiempo y coste actual?","¿Con qué datos puede funcionar?","¿Qué tareas son automatizables?","¿Qué revisa una persona?","¿Qué beneficio y riesgo medirás?"],
    33:["¿Qué problema comprobado existe?","¿Quién utilizará la solución y cómo?","¿Qué datos autorizados usarás?","¿Qué proveedor o modelo evaluarás?","¿Cómo sabrás que mejora el proceso?","¿Qué usos o datos quedan excluidos?","¿Qué piloto y responsable propones?"],
    34:["¿Qué resultado debe entregar el modelo?","¿Qué información fiable puede consultar?","¿Qué no debe hacer o revelar?","¿En qué estructura debe responder?","¿Qué ejemplo representa una buena salida?","¿Cómo detectamos errores y omisiones?"],
    35:["¿Con qué casos se prueba?","¿Cómo puntúas respuestas útiles?","¿Qué fallos se consideran críticos?","¿Cuál es el coste por resultado válido?","¿Cuál es la latencia admisible?","¿Quién aprueba y revisa el piloto?"],
    36:["¿Qué tipos de datos intervienen?","¿Qué autorización y finalidad existe?","¿Dónde se alojan y conservan los datos?","¿Qué errores o sesgos son posibles?","¿Cómo se supervisa y audita?","¿Qué controles y responsables existen?"],
    37:["Horas por operación × frecuencia","Coste interno real por hora (€)","Licencia, integración y mantenimiento (€)","Minutos de revisión humana por tarea","Beneficio anual - costes anuales (€)","¿Qué ocurre con escenario pesimista?"],
    38:["¿Qué tareas y equipos empiezan?","¿Qué formación requieren?","¿Qué herramientas se permiten?","¿Qué información no se puede compartir?","¿Quién lidera cada piloto?","¿Cómo se medirá calidad y adopción?"],
    39:["¿Qué afirmación puede ser refutada?","¿A quién preguntarás o probarás?","¿Cuál es el experimento más barato?","¿Qué resultado cambia la decisión?","¿Qué inversión y duración tendrá?","¿Perseverar, cambiar o parar?"],
    40:["¿Qué grupos tienen necesidades diferentes?","¿Qué otras opciones y precios existen?","¿Cuánto cuesta servir a cada cliente?","¿Qué precios pondrás a prueba?","¿Qué compran realmente las personas?","¿Qué margen y acción resultan?"],
    41:["¿A qué tipo de cliente se dirige?","¿Por dónde llegará?","¿Qué etapas recorrerá?","¿Qué conversión mide cada transición?","¿Cuánto tarda el ciclo de venta?","¿Qué mejora y responsable propones?"],
    42:["¿Qué espera conseguir cada actor?","¿Qué recursos aporta?","¿Qué valor obtiene?","¿Qué capacidad de decisión tiene?","¿Cómo se gobierna la alianza?","¿Qué dependencias debes evitar?"],
    43:["¿Qué cambio probado quieres multiplicar?","¿Qué debe adaptarse a cada lugar?","¿Qué modelo de réplica elegirás?","¿Cuánto cuesta cada resultado?","¿Cómo mantendrás estándares?","¿Cuándo expandirse y con qué evidencia?"],
    44:["Describe un riesgo medible","Baja / media / alta, con justificación","¿Cuántos € de caja compromete?","¿Qué indicador avisa antes?","¿Qué acción reduce el riesgo?","¿Quién responde y cuándo revisa?"]
  };
  const questions = prompts[t.n] || t.blocks;
  const card = (label, question, i, extra) => '<section class="field '+(extra||'')+'"><div class="field-head"><span class="step">'+String(i+1).padStart(2,"0")+'</span><h2>'+e(label)+'</h2></div><p>'+e(question)+'</p><div class="blank"></div></section>';
  let body = "";
  if (kind === "canvas") {
    const cells = t.blocks.map((b,i) => card(b,questions[i]||"",i,i===0?"lead":i===t.blocks.length-1?"wide":"")).join("");
    body = '<div class="canvas-grid">'+cells+'</div>';
  } else if (kind === "matrix") {
    const special = {
      19:["Mes","Saldo inicial (€)","Cobros (€)","Pagos (€)","Saldo final (€)","Alertas"],
      20:["Segmento / canal","Ingresos","Coste variable","Margen","CAC","Recuperación"],
      23:["Socio / instrumento","Títulos antes","% antes","Nuevos títulos","Títulos después","% después"],
      24:["Condición","Oferta A","Oferta B","Implicaciones","Decisión"],
      28:["Inversor","Encaje","Contacto","Estado","Próximo paso","Fecha"],
      31:["Indicador","Línea base","Meta / fecha","Fuente","Responsable","Revisión"],
      35:["Prueba","Resultado esperado","Resultado real","Error / gravedad","Coste","Decisión"],
      37:["Concepto","Situación actual","Con IA","Coste / ahorro anual","Supuestos"],
      40:["Segmento","Precio actual","Precio propuesto","Coste","Margen","Evidencia"],
      44:["Riesgo","Probabilidad","Impacto en caja","Alerta temprana","Mitigación","Responsable / revisión"]

function tplFile(t, ext) { return `plantillas/Branka_Plantilla_${t.slug}.${ext}`; }
async function downloadTpl(t) {
  const msg = document.getElementById("dlmsg");
  const name = `Branka_Plantilla_${t.slug}.pdf`;
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (!dl) { msg.innerHTML = `Abre la plantilla y guárdala desde ahí: <a href="${tplFile(t, "pdf")}" target="_blank" rel="noopener">${name}</a>`; return; }
    msg.textContent = "Preparando la descarga…";
    const blob = await (await fetch(tplFile(t, "pdf"))).blob();
    await dl.save({ filename: name, data: blob });
    msg.textContent = "Plantilla descargada.";
  } catch (e) {
    if (e && e.code === "declined") { msg.textContent = "Descarga cancelada."; return; }
    msg.innerHTML = `No se pudo descargar aquí. Ábrela y guárdala desde ahí: <a href="${tplFile(t, "pdf")}" target="_blank" rel="noopener">${name}</a>`;
  }
}

function keyForFile(name) {
  const n = name.toLowerCase();
  if (n.startsWith("ia_negocios_semana")) return NEWS.videoKey;
  const m = n.match(/pildora_(\d{2})_/);
  if (m) { const t = TOOLS.find(x => x.n === +m[1]); return t ? t.slug : null; }
  const t = TOOLS.find(x => n.includes(x.slug)); return t ? t.slug : null;
}

function wireAdmin() {
  const box = document.getElementById("admin");
  if (!box || !state.assets || !state.db) return;
  box.hidden = false;
  const input = document.getElementById("file-in"), drop = document.getElementById("drop"), log = document.getElementById("log");
  const line = (txt, cls) => { const d = document.createElement("div"); d.className = cls || ""; d.textContent = txt; log.prepend(d); };
  async function handle(files) {
    for (const f of files) {
      const key = keyForFile(f.name);
      if (!key) { line(`${f.name}: no sé a qué píldora pertenece. Renómbralo como Pildora_NN_….mp4.`, "bad"); continue; }
      try {
        line(`Subiendo ${f.name}…`);
        const a = await state.assets.upload(f);
        await state.db.doc("videos/" + key).set({ assetId: a.id, file: f.name, updated: new Date().toISOString() });
        line(`${f.name}: listo`, "good");
      } catch (e) { line(`${f.name}: no se pudo subir (${e && e.message ? e.message : e}). Vuelve a intentarlo.`, "bad"); }
    }
  }
  input.onchange = () => handle([...input.files]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); handle([...e.dataTransfer.files]); };
}

(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const db = await window.claude.use("db");
    if (db) {
      state.db = db;
      db.collection("videos").onSnapshot(snap => {
        const v = {};
        (snap.docs || snap).forEach(d => { const data = typeof d.data === "function" ? d.data() : d.data; v[d.id] = data; });
        state.videos = v;
        const playing = document.querySelector("video");
        if (!playing || playing.paused) route();
      }, () => {});
    }
    const assets = await window.claude.use("assets");
    if (assets) { state.assets = assets; wireAdmin(); }
  } catch (e) { /* la página funciona sin vídeos guardados */ }
})();
</script>
<script>
(() => {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const app = document.getElementById("app");
  const header = document.querySelector("header.top");

  // Cabecera que se compacta y barra de progreso de lectura
  const bar = document.createElement("div");
  bar.className = "progress";
  document.body.appendChild(bar);
  const onScroll = () => {
    header.classList.toggle("scrolled", window.scrollY > 12);
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    bar.style.transform = `scaleX(${max > 0 ? h.scrollTop / max : 0})`;
  };
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  const WORDS = ["pasado por ahí", "fundado su empresa", "conseguido sus primeros clientes", "levantado una ronda", "fracasado y vuelto a empezar"];
  const TOPICS = ["Validar la idea", "Primeros clientes", "Precio", "Ventas", "Producto", "Equipo", "Socios", "Financiación", "Marketing", "Operaciones", "Estrategia", "Crecimiento"];
  let timer = null, wi = 0;

  function decorate() {
    observer.disconnect();
    app.classList.remove("enter");
    void app.offsetWidth;
    app.classList.add("enter");

    document.querySelectorAll(".hero, .news-head").forEach(h => {
      if (!h.querySelector(".blobs")) h.insertAdjacentHTML("afterbegin", '<div class="blobs" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>');
    });

    clearInterval(timer);
    const h1 = document.querySelector(".hero.home h1");
    if (h1 && !h1.querySelector(".rot")) {
      wi = 0;
      h1.innerHTML = 'Monta tu consejo asesor con quien ya ha <span class="rot"><span>pasado por ahí</span></span>';
      if (!reduce) {
        timer = setInterval(() => {
          const r = h1.querySelector(".rot");
          if (!r || !document.body.contains(r)) return clearInterval(timer);
          wi = (wi + 1) % WORDS.length;
          const cur = r.querySelector("span:not(.out)");
          if (cur) { cur.classList.add("out"); setTimeout(() => cur.remove(), 520); }
          const s = document.createElement("span");
          s.textContent = WORDS[wi];
          r.appendChild(s);
        }, 2600);
      }
    }

    const hero = document.querySelector(".hero.home");
    if (hero && !app.querySelector(".marquee")) {
      const items = TOPICS.concat(TOPICS).map(t => `<span>${t}</span>`).join("");
      hero.insertAdjacentHTML("afterend", `<div class="marquee" aria-hidden="true"><div class="mq-track">${items}</div></div>`);
    }
    observer.observe(app, { childList: true });
  }

  const observer = new MutationObserver(decorate);
  decorate();

  // Luz que sigue al cursor en las tarjetas
  document.addEventListener("pointermove", e => {
    const c = e.target.closest && e.target.closest(".card, .res-card, .stage, .inc, .story, .ep");
    if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", `${e.clientX - r.left}px`);
    c.style.setProperty("--my", `${e.clientY - r.top}px`);
  }, { passive: true });
})();

</script>
</body>

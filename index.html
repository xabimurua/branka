<style>
:root {
  /* Branka: el degradado del icono (naranja → rojo) para cabecera, acciones y acentos; fondo claro cálido para leer cómodo.
     Layout: cabecera roja con el icono, ruta de 5 fases como filtro, biblioteca en rejilla y ficha de detalle por herramienta. */
  --brand: #a52b17;
  --orange: #ec8f35;

  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 17px; line-height: 1.55; }

}

/* ---------- Capa dinámica ---------- */
html { scroll-behavior: smooth; }

/* Degradado vivo en las cabeceras */
.hero, .news-head {
  background: linear-gradient(120deg, #ee9a3c 0%, #e8702e 25%, #dd4a25 50%, #b9311a 75%, #ee9a3c 100%);
  background-size: 300% 300%;
  animation: gradShift 16s ease-in-out infinite alternate;
  position: relative; overflow: hidden; isolation: isolate;
}
@keyframes gradShift { from { background-position: 0% 40%; } to { background-position: 100% 60%; } }

/* Formas del icono flotando */
.hero > .blobs, .news-head > .blobs { position: absolute; inset: 0; z-index: -1; pointer-events: none; max-width: none; }
.blobs span { position: absolute; display: block; will-change: transform; }
.blobs .b1 { width: 520px; height: 250px; right: -120px; bottom: -90px; border-radius: 50%; background: linear-gradient(135deg, rgba(255,214,160,.35), rgba(165,43,23,.35)); transform: rotate(-38deg); animation: floatA 14s ease-in-out infinite alternate; }
.blobs .b2 { width: 300px; height: 300px; right: 18%; top: -120px; background: linear-gradient(160deg, rgba(255,226,190,.32), rgba(255,255,255,0)); clip-path: polygon(0 0, 44% 0, 73% 17%, 15% 62%, 0 9%); animation: floatB 18s ease-in-out infinite alternate; }
.blobs .b3 { width: 90px; height: 90px; left: 58%; bottom: 14%; border-radius: 50%; background: rgba(255,240,225,.18); animation: floatC 10s ease-in-out infinite alternate; }
@keyframes floatA { from { transform: rotate(-38deg) translate(0, 0); } to { transform: rotate(-30deg) translate(-40px, -30px); } }
@keyframes floatB { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(-60px, 40px) rotate(12deg); } }
@keyframes floatC { from { transform: translate(0, 0) scale(1); } to { transform: translate(30px, -40px) scale(1.25); } }

/* Titular con frase que cambia */
.hero.home h1 { max-width: 18ch; }
.rot { display: grid; margin-top: .08em; }
.rot > span { grid-area: 1 / 1; width: max-content; max-width: 100%; color: #fff; background: rgba(120, 24, 10, .28); border-radius: .18em; padding: 0 .22em; box-decoration-break: clone; -webkit-box-decoration-break: clone; animation: wordIn .6s cubic-bezier(.2,.8,.2,1) both; }
.rot > span.out { animation: wordOut .5s ease both; }
@keyframes wordIn { from { opacity: 0; transform: translateY(.6em) rotateX(40deg); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes wordOut { to { opacity: 0; transform: translateY(-.5em); filter: blur(4px); } }

/* Cinta de temas */
.marquee { margin: 0 calc(50% - 50vw); background: var(--brand); color: #fff; overflow: hidden; padding: 14px 0; border-top: 1px solid rgba(255,255,255,.12); }

@keyframes marquee { to { transform: translateX(-50%); } }

/* Entrada al cambiar de sección */
#app.enter { animation: pageIn .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* Tarjetas: elevación y luz que sigue al cursor */
.card, .res-card, .stage, .inc, .story, .ep, .steps li, .panel { position: relative; transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s; }
.card::after, .res-card::after, .stage::after, .inc::after, .story::after, .ep::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(320px circle at var(--mx, 50%) var(--my, 50%), rgba(236, 143, 53, .16), transparent 60%);
}
.card:hover::after, .res-card:hover::after, .stage:hover::after, .inc:hover::after, .story:hover::after, .ep:hover::after { opacity: 1; }
.res-card:hover, .stage:hover, .inc:hover, .story:hover, .ep:hover, .steps li:hover { transform: translateY(-4px); box-shadow: 0 14px 34px rgba(165, 43, 23, .14); }

/* Etapas: línea de recorrido animada */
.stages { position: relative; }
.stage::before { background: linear-gradient(90deg, #ec8f35, #da3a22, #ec8f35); background-size: 200% 100%; animation: flow 3.5s linear infinite; }
@keyframes flow { to { background-position: 200% 0; } }

/* Pasos: número que late */
.steps li::before { transition: transform .3s; }
.steps li:hover::before { transform: scale(1.15) rotate(-8deg); }

/* Botones con brillo */
.btn { position: relative; overflow: hidden; transition: transform .2s, box-shadow .2s; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(165, 43, 23, .22); }
.btn.primary::after, .btn.white::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); transform: skewX(-20deg); transition: left .6s; }
.btn.primary:hover::after, .btn.white:hover::after { left: 120%; }
nav.main a.navcta { animation: pulse 3.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.55); } 50% { box-shadow: 0 0 0 7px rgba(255,255,255,0); } }

/* Aparición al hacer scroll (solo donde el navegador lo soporta; si no, todo se ve igual, sin animar) */
@supports (animation-timeline: view()) {
  .card, .res-card, .stage, .inc, .story, .ep, .steps li, .mentor-band, .apply, .feat, .sec-h, .panel, .tpl {
    animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 40%;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(46px) scale(.97); } to { opacity: 1; transform: none; } }
}

.mentor-band { background: linear-gradient(120deg, #a52b17, #7c1d0e, #a52b17); background-size: 200% 200%; animation: gradShift 12s ease-in-out infinite alternate; position: relative; overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .hero, .news-head, .mentor-band, .mq-track, .blobs span, .stage::before, nav.main a.navcta, #app.enter { animation: none !important; }
  .card, .res-card, .stage, .inc, .story, .ep, .steps li, .mentor-band, .apply, .feat, .sec-h, .panel, .tpl { animation: none !important; }
}

<script id="tools-data" type="application/json">{"tools":[{"slug":"01_identificacion_necesidad","n":1,"name":"Identificación de la necesidad","ph":0,"para":"Detectar qué cambia en tu entorno y encontrar ahí una necesidad real.","blocks":["Tendencias demográficas","Regulación","Entorno económico","Competidores","Tendencias tecnológicas","Necesidades de cliente","Incertidumbre"],"cuando":"Al arrancar, antes de tener producto. Y revísala cada año.","guion":["Identificación de la necesidad. Antes de pensar en tu producto, mira el mundo que lo rodea.","Esta herramienta sirve para detectar qué está cambiando en tu entorno y encontrar ahí una necesidad real, en lugar de partir de una idea que solo te gusta a ti.","Se usa como un mapa con siete zonas alrededor de tu empresa: tendencias demográficas, regulación, entorno económico, competidores, tendencias tecnológicas, necesidades de cliente e incertidumbres. En cada zona apunta cambios concretos, con datos y fuentes. Después busca dónde se cruzan varios cambios: ahí suele esconderse la oportunidad.","¿Cuándo usarla? Al principio de todo, en la fase de exploración, antes de tener producto. Y vuelve a ella cada año para comprobar que tu negocio sigue respondiendo a una necesidad viva."]},{"slug":"02_tendencias_consumo","n":2,"name":"Consumer Trend Canvas","ph":0,"para":"Convertir una tendencia de consumo en una idea de innovación para tu negocio.","blocks":["Necesidades básicas","Drivers de cambio","Inspiración","Expectativas emergentes","Tipo de innovación","¿A quién?","Tu innovación"],"cuando":"Explorando ideas, o cuando quieres renovar una oferta que ya existe.","guion":["Sirve para coger una tendencia que ves en la calle o en las noticias y convertirla en una idea de negocio concreta. No basta con decir que algo está de moda: hay que entender por qué y qué significa para ti.","Tiene dos partes. Primero analizas: qué necesidad profunda cubre la tendencia, qué está cambiando para que surja ahora, cómo la aplican otras empresas y qué nuevas expectativas crea en los consumidores. Después aplicas: qué tipo de innovación harías, para qué nuevo grupo de clientes, y lo resumes en tu propia innovación.","Úsalo en la fase de exploración, cuando buscas ideas, o más adelante, cuando quieras renovar una oferta que ya tienes en el mercado."]},{"slug":"03_tecnologia_disruptiva","n":3,"name":"Tecnología disruptiva","ph":0,"para":"Comparar varias ideas y puntuar su potencial disruptivo del 1 al 10.","blocks":["Desirability","Feasibility","Viability","Potencial disruptivo","Idea 1 … Idea 6"],"cuando":"Cuando tienes varias ideas y debes elegir en cuál apostar.","guion":["Sirve para comparar varias ideas o innovaciones y decidir cuál tiene más potencial de cambiar las reglas del juego, en vez de quedarte con la primera que se te ocurrió.","Pones hasta seis ideas en filas y las valoras con tres criterios. Deseabilidad: ¿resuelve un problema importante y creciente del cliente? Factibilidad: ¿es mucho mejor que lo que existe? Y viabilidad: ¿es mucho más barata y permite nuevos modelos de negocio? Puntúa cada una del uno al diez y suma: el total es su potencial disruptivo.","Úsala cuando tienes varias ideas sobre la mesa y debes elegir en cuál apostar tu tiempo. Es un filtro rápido antes de invertir en validar."]},{"slug":"04_mapa_empatia","n":4,"name":"Mapa de empatía","ph":1,"para":"Ponerte en la piel de tu cliente: qué piensa, siente, ve, oye, dice y hace.","blocks":["¿Con quién empatizamos?","Objetivo","¿Qué ve?","¿Qué escucha?","¿Qué dice?","¿Qué hace?","¿Qué piensa y siente?","Pains","Gains"],"cuando":"Antes y después de entrevistar a clientes potenciales.","guion":["Sirve para ponerte de verdad en la piel de tu cliente. No para describir lo que tú crees que necesita, sino para entender cómo vive su situación.","Empieza definiendo con quién empatizas y qué necesita conseguir. Después rellena qué ve en su entorno, qué escucha de amigos y referentes, qué dice y qué hace realmente. En el centro, qué piensa y siente. Y para cerrar, sus pains, es decir, miedos y frustraciones, y sus gains, sus deseos y sueños. Separa lo que has observado de lo que imaginas.","¿Cuándo? En cuanto tengas un segmento de cliente en mente. Úsalo para preparar entrevistas y vuelve a rellenarlo después, con lo que has aprendido."]},{"slug":"05_personas","n":5,"name":"Personas · Público objetivo","ph":1,"para":"Dar cara y nombre a tu cliente ideal para tomar mejores decisiones.","blocks":["Foto y nombre","Edad · Sexo · Ocupación","Localización · Ingresos","Educación","Objetivos","Motivaciones","Frustraciones","Aficiones","Marcas que le gustan","Dispositivos"],"cuando":"Tras las primeras entrevistas, antes de diseñar producto y marketing.","guion":["Sirve para dar cara y nombre a tu cliente ideal. Cuando el equipo comparte la misma persona en la cabeza, las decisiones de producto, precio y comunicación son mucho más fáciles.","Rellena una ficha como si fuera alguien real: foto, edad, ocupación, dónde vive, ingresos y formación. Luego lo importante: sus objetivos, sus motivaciones y sus frustraciones. Y termina con aficiones, marcas que le gustan y qué dispositivos usa. Basa cada dato en entrevistas, no en suposiciones, y haz una ficha por cada tipo de cliente.","Úsala después de tus primeras entrevistas y antes de diseñar el producto o la campaña de marketing. Tenla siempre a mano en las reuniones."]},{"slug":"06_value_proposition_canvas","n":6,"name":"Value Proposition Canvas","ph":2,"para":"Formular en una frase qué valor das, a quién y en qué te diferencias.","blocks":["Nuestros productos y servicios","ayudan a… (verbo)","segmento de cliente","que quieren… (jobs to be done)","a diferencia de… (alternativa)"],"cuando":"Cuando ya conoces al cliente y necesitas explicar tu solución.","guion":["Sirve para resumir en una sola frase qué ofreces, a quién y por qué eres diferente. Si no sabes decirlo en una frase, tu cliente tampoco lo va a entender.","La plantilla es una frase con huecos. Nuestros productos y servicios, ayudan a, y aquí un verbo, a tal segmento de cliente, que quieren conseguir tal tarea o resultado, a diferencia de la alternativa que usan hoy. Prueba varias versiones, léelas en voz alta y quédate con la más clara y concreta. Después, contrástala con clientes reales.","Úsala cuando ya has entendido al cliente con el mapa de empatía y la ficha de Personas, y antes de construir tu modelo de negocio o tu pitch."]},{"slug":"07_matriz_competencia","n":7,"name":"Matriz de competencias","ph":2,"para":"Compararte con tu competencia en los puntos que te hacen diferente.","blocks":["Nuestra empresa","Competidor 2","Competidor 3","Competidor 4 …","Propuesta diferencial 1","Propuesta diferencial 2","Propuesta diferencial 3","Propuesta diferencial 4"],"cuando":"Al definir tu propuesta y antes de presentar a inversores.","guion":["Sirve para ver de un vistazo cómo te sitúas frente a tu competencia en aquello que te hace diferente. Decir que no tienes competencia nunca es una buena señal.","En las filas pones tu empresa y hasta cinco competidores, directos o alternativos. En las columnas, tus cuatro propuestas diferenciales: precio, rapidez, sostenibilidad, experiencia, lo que te distinga. Marca o puntúa a cada uno. Si en ninguna columna destacas claramente, tu propuesta aún no es lo bastante diferente.","Úsala cuando estás definiendo tu propuesta de valor y repítela antes de presentar el proyecto a inversores o socios. Es una diapositiva casi obligatoria."]},{"slug":"08_calculo_mercado","n":8,"name":"Cálculo de mercado · TAM SAM SOM","ph":2,"para":"Estimar el tamaño real de tu oportunidad en clientes y en euros.","blocks":["TAM · mercado total","SAM · mercado que encaja contigo","SOM · mercado que puedes captar"],"cuando":"Antes de hacer tu plan financiero o buscar financiación.","guion":["Sirve para estimar el tamaño de tu oportunidad, tanto en número de clientes como en facturación. Te ayuda a saber si el negocio merece la pena y a defenderlo ante inversores.","Son tres círculos, uno dentro de otro. El TAM es el mercado total. El SAM es la parte de ese mercado que encaja con tu oferta y tu modelo de negocio. Y el SOM es la parte que de verdad puedes captar y atender en los próximos años. Calcula de abajo arriba: número de clientes por precio, y deja escritas tus fuentes y supuestos.","Úsalo cuando ya tienes clara la propuesta y la competencia, y siempre antes de hacer tu plan financiero o de salir a buscar financiación."]},{"slug":"09_business_model_canvas","n":9,"name":"Business Model Canvas","ph":3,"para":"Ver todo tu modelo de negocio en una sola página.","blocks":["Partners clave","Actividades clave","Recursos clave","Propuesta de valor","Relación con clientes","Canales","Segmentos de clientes","Estructura de costes","Fuentes de ingresos"],"cuando":"Cuando pasas de idea a modelo. Actualízalo tras cada aprendizaje.","guion":["Sirve para ver todo tu modelo de negocio en una sola página: cómo creas valor, cómo lo entregas y cómo ganas dinero. Es el mapa que conecta todas las demás herramientas.","Tiene nueve bloques. A la derecha, el cliente: segmentos, propuesta de valor, canales y relación con clientes. A la izquierda, la operación: actividades, recursos y partners clave. Y abajo, los números: estructura de costes y fuentes de ingresos. Rellénalo con pósits, una idea por pósit, empezando por el cliente y la propuesta de valor.","Úsalo cuando pasas de una idea a un modelo de negocio. No es un documento que se hace una vez: actualízalo después de cada experimento o conversación con clientes."]},{"slug":"10_service_blueprint","n":10,"name":"Service Blueprint","ph":3,"para":"Diseñar lo que el cliente vive y lo que tiene que pasar por detrás.","blocks":["Atracción","Compra","Uso","Valoración y recomendación","Evidencias físicas","Acciones del cliente","Línea emocional","Touchpoints","Operativa","Procesos de apoyo"],"cuando":"Antes de lanzar un piloto, para que la operación esté lista.","guion":["Sirve para definir las acciones y procesos que tienen que pasar, a nivel operativo, para que tu producto o servicio funcione. Une lo que el cliente vive con lo que tu equipo hace por detrás.","En horizontal, las fases del cliente: atracción, compra, uso, y valoración y recomendación. En vertical, las capas. Arriba, el frontstage: evidencias físicas, acciones del cliente, su línea emocional y los puntos de contacto. Abajo, el backstage: la operativa y los procesos de apoyo que el cliente no ve. Busca los momentos con emoción negativa: ahí tienes que mejorar.","Úsalo antes de lanzar tu primer piloto, para que la operación esté preparada, y cada vez que algo falle en la experiencia del cliente."]},{"slug":"11_product_market_fit","n":11,"name":"Product-Market Fit","ph":3,"para":"Alinear lo que pide el mercado con lo que ofrece tu producto.","blocks":["Problemas y necesidades ↔ Características","Madurez del mercado ↔ Alternativas","Experiencia de usuario ↔ Valor diferencial","Canales ↔ Valor añadido del canal"],"cuando":"Al diseñar tu MVP y al revisar los resultados del piloto.","guion":["Sirve para comprobar que lo que ofrece tu producto encaja con lo que de verdad pide el mercado. Sin ese encaje, ningún presupuesto de marketing te va a salvar.","La plantilla enfrenta dos columnas en cuatro parejas. Problemas y necesidades del cliente, frente a las características de tu producto. Madurez del mercado, frente a las alternativas que ya existen. La experiencia de usuario, frente a tu valor diferencial. Y los canales de compra, frente al valor que aporta tu canal. Cada pareja debe responderse con evidencias.","Úsalo cuando diseñas tu producto mínimo viable y otra vez cuando analizas los resultados del piloto. Si las columnas no encajan, toca pivotar."]},{"slug":"12_vision_futuro","n":12,"name":"Canvas de visión de futuro","ph":4,"para":"Definir hacia dónde va tu negocio y qué pasos te llevan allí.","blocks":["Visión","Grandes hitos","Apoyos","Retos","Temáticas"],"cuando":"Al formar el equipo y al empezar cada año.","guion":["Sirve para definir hacia dónde quieres llevar tu negocio y cómo vas a ayudar a tus clientes a largo plazo. Alinea al equipo y da sentido a las decisiones del día a día.","En el centro escribe la visión: cómo será tu negocio dentro de unos años. Alrededor, los grandes hitos que te acercan a ella, agrupados por temáticas, como producto, equipo o mercado. Después identifica los apoyos que te van a ayudar a conseguirlo y los retos que te lo pueden dificultar. Que sea ambiciosa, pero creíble.","Úsalo al formar el equipo fundador y al empezar cada año. Es el punto de partida para fijar tus OKRs."]},{"slug":"13_okrs","n":13,"name":"OKRs","ph":4,"para":"Convertir la visión en objetivos medibles y acciones concretas.","blocks":["Objetivo anual","Objetivo trimestral","Resultados clave","Acciones clave"],"cuando":"Cada trimestre, en cuanto tengas equipo y visión.","guion":["Sirven para convertir tu visión en objetivos medibles y en acciones concretas. Así todo el equipo sabe qué es lo más importante ahora y cómo se mide el avance.","Parte de un objetivo anual, inspirador y cualitativo. Divídelo en objetivos trimestrales. Para cada uno define resultados clave medibles, con un número y una fecha, por ejemplo cien clientes de pago en marzo. Y debajo, las acciones clave que vas a hacer para lograrlos. Pocos objetivos, como mucho tres resultados clave por cada uno.","Úsalos en cuanto tengas equipo y visión. Revísalos cada semana y fíjalos de nuevo cada trimestre."]},{"slug":"14_plan_negocio","n":14,"name":"Plan de negocio","ph":4,"para":"Proyectar ingresos y gastos para saber si el negocio se sostiene.","blocks":["Mes 1 … Mes 5","Año 2 · Año 3","Equipo","Marketing","Tecnología","Oficina y transporte","Ingresos por cliente o línea"],"cuando":"Antes de pedir financiación y para controlar tu caja.","guion":["Sirve para proyectar tus ingresos y tus gastos y saber si tu negocio se sostiene, cuánto dinero necesitas y cuándo llegarías al equilibrio.","En columnas, el tiempo: los primeros meses uno a uno, y después el año dos y el año tres. En filas, primero la estructura de gastos: personas, marketing, tecnología, servicios, oficina, transporte. Después la estructura de ingresos, por cliente o por línea de negocio. Usa los datos de tu cálculo de mercado y sé conservador con los ingresos.","Úsalo cuando ya tienes modelo de negocio y antes de pedir financiación. Y después, compáralo cada mes con la realidad para controlar tu caja."]},{"slug":"15_escenarios","n":15,"name":"Escenarios","ph":4,"para":"Preparar tu negocio para que las cosas vayan mejor o peor de lo previsto.","blocks":["Indicadores · KPIs","Escenario optimista","Escenario moderado","Escenario pesimista"],"cuando":"Junto al plan de negocio, y al revisar resultados.","guion":["Sirve para prepararte ante distintos futuros. Las cosas casi nunca salen como en el plan, así que conviene saber de antemano qué harás si van mejor o peor.","Primero define tus indicadores clave: clientes conseguidos, clientes fidelizados, ingresos, tamaño del equipo. Después describe tres escenarios, optimista, moderado y pesimista, con el valor de cada indicador en cada uno. Y lo más útil: decide qué decisiones tomarías en cada caso, por ejemplo contratar, recortar gastos o buscar financiación.","Úsala junto al plan de negocio y cada vez que revises resultados. Así sabrás pronto en qué escenario estás y podrás reaccionar a tiempo."]},{"slug":"16_riesgos","n":16,"name":"Riesgos del proyecto","ph":4,"para":"Anticipar lo que puede salir mal y cómo lo vas a mitigar.","blocks":["Producto o servicio","Venta y comercialización","Gestión de la operativa","Riesgos económico-financieros","Impacto generado"],"cuando":"Antes de lanzar un piloto y en cada revisión trimestral.","guion":["Sirve para identificar qué puede salir mal antes de que pase, y preparar cómo reducirlo. Los inversores valoran mucho a quien conoce sus riesgos.","Repasa cinco áreas: el producto o servicio, la venta y comercialización, la gestión de la operativa interna, los riesgos económico-financieros y el impacto generado. En cada una explica los riesgos principales, valora su probabilidad y su impacto, y elige una métrica para vigilarlos. Añade una acción concreta para mitigar los más graves.","Úsala antes de lanzar un piloto y revísala en cada cierre de trimestre, junto a tus OKRs y escenarios."]},{"slug":"17_impacto_positivo","n":17,"name":"Impacto positivo","ph":4,"para":"Medir el impacto social, medioambiental y económico de tu proyecto.","blocks":["Impacto social","Impacto medioambiental","Impacto económico","Positivo y negativo"],"cuando":"Desde el diseño del modelo, y al presentar a inversores de impacto.","guion":["Sirve para analizar qué huella deja tu proyecto en el mundo, más allá de la facturación. Cada vez más clientes, talento e inversores lo miran antes de decidir.","Tiene tres áreas. Impacto social: contribución local, diversidad, igualdad y apoyo a colectivos. Impacto medioambiental: residuos, huella hídrica, huella de carbono y reaprovechamiento. Impacto económico: empleo, sostenibilidad del negocio en el tiempo y riqueza para el entorno. En cada una anota el impacto positivo, pero también el negativo, con honestidad.","Úsala desde que diseñas tu modelo de negocio, no al final. Y llévala contigo cuando presentes el proyecto a inversores o a convocatorias de impacto."]},{"slug":"18_mapa_de_financiacion","n":18,"name":"Mapa de financiación","ph":4,"para":"Seleccionar subvenciones, deuda, crowdfunding o capital según necesidades y obligaciones.","blocks":["Necesidad y destino del dinero","Fuente de financiación","Requisitos y elegibilidad","Coste, garantías y dilución","Calendario y documentación","Alternativa si no se consigue"],"cuando":"Antes de pedir financiación.","guion":["Mapa de financiación. Seleccionar subvenciones, deuda, crowdfunding o capital según necesidades y obligaciones.","Empieza definiendo necesidad y destino del dinero y fuente de financiación. Escribe datos y supuestos concretos; cuando no haya evidencia, marca la hipótesis como pendiente.","Completa el resto de la ficha: requisitos y elegibilidad, coste, garantías y dilución, calendario y documentación, alternativa si no se consigue. Prioriza decisiones, cifras y responsables en lugar de texto genérico.","Ejemplo orientativo: Ejemplo: combinar 15.000 € de aportación propia, 20.000 € de subvención condicionada y 25.000 € de préstamo; verificar plazos y tesorería.","Cierra la herramienta con una decisión, un responsable y una fecha de revisión. Antes de pedir financiación. Esta ficha es un apoyo de planificación; las decisiones legales, fiscales o financieras requieren contraste profesional."],"example":"Ejemplo: combinar 15.000 € de aportación propia, 20.000 € de subvención condicionada y 25.000 € de préstamo; verificar plazos y tesorería.","worksheets":[{"label":"Necesidad y destino del dinero","prompt":"Anota el dato o la decisión que corresponde a «necesidad y destino del dinero»."},{"label":"Fuente de financiación","prompt":"Indica qué información verificable respalda este apartado y qué falta por confirmar."},{"label":"Requisitos y elegibilidad","prompt":"Anota el dato o la decisión que corresponde a «requisitos y elegibilidad»."},{"label":"Coste, garantías y dilución","prompt":"Indica qué información verificable respalda este apartado y qué falta por confirmar."},{"label":"Calendario y documentación","prompt":"Anota el dato o la decisión que corresponde a «calendario y documentación»."},{"label":"Alternativa si no se consigue","prompt":"Indica qué información verificable respalda este apartado y qué falta por confirmar."}]},{"slug":"19_tesoreria_burn_rate_y_runway","n":19,"name":"Tesorería, burn rate y runway","ph":4,"para":"Calcular el consumo de caja y anticipar cuándo habrá que captar fondos o recortar costes.","blocks":["Saldo de caja hoy","Cobros mensuales previstos","Pagos fijos y variables","Flujo neto mensual","Meses de runway","Acción preventiva y fecha"],"cuando":"Revisar cada mes y antes de incorporar gastos fijos.","guion":["Tesorería, burn rate y runway. Calcular el consumo de caja y anticipar cuándo habrá que captar fondos o recortar costes.","Empieza definiendo saldo de caja hoy y cobros mensuales previstos. Escribe datos y supuestos concretos; cuando no haya evidencia, marca la hipótesis como pendiente.","Completa el resto de la ficha: pagos fijos y variables, flujo neto mensual, meses de runway, acción preventiva y fecha. Prioriza decisiones, cifras y responsables en lugar de texto genérico.","Ejemplo orientativo: Ejemplo: 60.000 € de caja y 10.000 € de consumo neto mensual equivalen a seis meses de runway si el ritmo no cambia.","Cierra la herramienta con una decisión, un responsable y una fecha de revisión. Revisar cada mes y antes de incorporar gastos fijos. Esta ficha es un apoyo de planificación; las decisiones legales, fiscales o financieras requieren contraste profesional."],"example":"Ejemplo: 60.000 € de caja y 10.000 € de consumo neto mensual equivalen a seis meses de runway si el ritmo no cambia.","worksheets":[{"label":"Saldo de caja hoy","prompt":"Anota el dato o la decisión que corresponde a «saldo de caja hoy»."},{"label":"Cobros mensuales previstos","prompt":"Indica qué información verificable respalda este apartado y qué falta por confirmar."},{"label":"Pagos fijos y variables","prompt":"Anota el dato o la decisión que corresponde a «pagos fijos y variables»."},{"label":"Flujo neto mensual","prompt":"Indica qué información verificable respalda este apartado y qué falta por confirmar."},{"label":"Meses de runway","prompt":"Anota el dato o la decisión que corresponde a «meses de runway»."},{"label":"Acción preventiva y fecha","prompt":"Indica qué información verificable respalda este apartado y qué falta por confirmar."}]},{"slug":"20_unit_economics_cac_ltv_y_margen","n":20,"name":"Unit economics: CAC, LTV y margen","ph":3,"para":"Ver si cada cliente aporta margen suficiente para so <script id="news-data" type="application/json">{"week":"Branka Insights · actualizado el 24/11/2026","videoKey":"noticias-2026-11-20","videoFile":"IA_negocios_semana_20nov2026.mp4","items":[{"url":"/noticias/sierra-capta-1-750-millones-y-vale-30-000-millones-cobrando-por-re-5f45c437.html","tag":"Inteligencia artificial","title":"Sierra capta 1.750 millones y vale 30.000 millones cobrando por resultados","body":"La startup de agentes de IA para atención al cliente de Bret Taylor y Clay Bavor cierra su tercera ronda en 14 meses, casi duplica su valoración en medio año y abre oficina en Múnich.","lesson":"Sierra no cobra por uso ni por tokens, sino por cada problema resuelto, préstamo concedido o siniestro pagado. Si tu producto genera un resultado medible, ligar el precio a ese resultado reduce el riesgo del cliente y acorta la venta.","action":"Escribe el resultado concreto que tu cliente paga por conseguir y diseña una tarifa de prueba ligada a ese resultado para tus próximos tres clientes.","tool":"40_estrategia_de_precios","sources":[["SiliconANGLE","https://siliconangle.com/2026/11/23/ai-agent-provider-sierra-closes-1-75b-investment-amid-rapid-revenue-growth/"],["Trending Topics","https://www.trendingtopics.eu/sierra-ai-agents-funding-30-billion/"]],"paragraphs":["Sierra, la empresa estadounidense que crea agentes de inteligencia artificial para atender a los clientes de grandes compañías, ha anunciado una ronda de 1.750 millones de dólares (unos 1.570 millones de euros) que la valora en 30.000 millones. La lideran Greenoaks y Lightspeed, y repiten inversores anteriores como Benchmark, Sequoia, GV y Tiger Global.","Es su tercera ronda en 14 meses. En mayo había levantado 950 millones con una valoración de 15.800 millones, así que en unos seis meses casi la ha duplicado. Unas semanas antes de este anuncio, la compañía comunicó que sus ingresos anualizados superaban los 400 millones de dólares y que casi la mitad de esa cifra se había sumado en el último trimestre.","La fundaron en 2023 Bret Taylor, que fue codirector general de Salesforce, y Clay Bavor, exdirectivo de Google. Sus agentes resuelven tareas como reclamaciones o aprobaciones de préstamos y trabajan para bancos y aseguradoras como JPMorganChase, Wells Fargo, HSBC, Santander o Prudential. Según la empresa, la mitad de las compañías del Fortune 50 ya son clientes.","Lo más llamativo para quien emprende es su modelo de precios. Sierra cobra por resultados: un problema resuelto, un préstamo formalizado o un siniestro pagado, en lugar de cobrar por uso o por consumo de tokens. Además, reparte cada petición entre más de una docena de modelos de lenguaje: los casos sencillos van a modelos rápidos y baratos, y los complejos, a los más potentes.","La empresa usará el dinero para ampliar su catálogo de productos y contratar más comerciales. También ha abierto una oficina en Múnich para atender a clientes de Alemania, Austria y Suiza, un mercado donde compite con la berlinesa Parloa, además de con Decagon, Salesforce o Zendesk."],"published":"2026-11-24T07:35:26.879853+00:00","generated_with_ai":true},{"url":"/noticias/la-impact-social-cup-bate-record-con-7-768-proyectos-de-38-paises-fa4e2214.html","tag":"Impacto social","title":"La Impact Social Cup bate récord con 7.768 proyectos de 38 países","body":"La tercera edición de la competición de emprendimiento social, la primera abierta a Latinoamérica, reúne 2.157 candidaturas completas y anunciará a sus 64 semifinalistas el 9 de diciembre en Las Rozas.","lesson":"Salud, inclusión y educación concentran la mayoría de los proyectos, así que destacar ahí exige algo más que una buena causa: un impacto medible y un modelo que se sostenga económicamente. Las competiciones sirven para validar ambas cosas y conseguir contactos con empresas e inversores.","action":"Define en una frase el cambio que produce tu proyecto y elige dos indicadores con los que puedas demostrarlo antes de presentarte a la próxima convocatoria.","tool":"31_indicadores_de_impacto_social","sources":[["Vivir Ediciones","https://vivirediciones.es/madrid-impact-social-cup-2026-emprendimiento-internacional"],["El Español","https://www.elespanol.com/treintayseis/economia/emprendedores/20261123/gallego-tomas-garnelo-impulsa-nueva-edicion-record-impact-social-cup/1003744468736_0.html"]],"paragraphs":["La Impact Social Cup, una competición internacional que premia proyectos capaces de resolver retos sociales y medioambientales, ha cerrado la inscripción de su tercera edición con cifras récord: 7.768 proyectos registrados y 2.157 candidaturas completas de 38 países. Es la primera edición abierta a Latinoamérica.","España aporta 1.090 candidaturas. La Comunidad de Madrid, socio institucional del certamen, encabeza la lista con 278, una de cada cuatro. Le siguen Cataluña (157), Andalucía (151), la Comunitat Valenciana (130) y Galicia, quinta con 59.","Los proyectos se reparten en ocho áreas. Salud y bienestar es la más concurrida, con 483 candidaturas, seguida de inclusión social y diversidad (347) y educación y empleabilidad (279). Energía sostenible es la menos representada, con 80. También hay dos categorías: Impacto Escalable, para iniciativas que pueden crecer a otros territorios (1.421), e Impacto Cercano, para proyectos locales y comunitarios (736).","Un comité técnico elegirá a 64 semifinalistas, que se anunciarán el 9 de diciembre en el Auditorio Joaquín Rodrigo de Las Rozas. La final, con 16 proyectos, se celebrará el 18 de junio de 2027 en Madrid con unas 5.000 personas. Además de competir, los participantes reciben formación, acompañamiento y acceso a empresas e inversores.","Detrás del récord están el pontevedrés Tomás Garnelo y la burgalesa Carmen Pino. Garnelo defiende que la viabilidad económica y el impacto social tienen que ir juntos, y que se pueden crear empresas para resolver problemas estructurales. La edición anterior la ganó Aldealista, una plataforma contra la despoblación rural."],"published":"2026-11-24T07:35:26.879853+00:00","generated_with_ai":true},{"url":"/noticias/stark-future-fermat-devengo-y-wilco-lideran-las-rondas-espanolas-d-f74ea968.html","tag":"Financiación","title":"Stark Future, Fermat, Devengo y Wilco lideran las rondas españolas de la semana","body":"Entre el 16 y el 20 de noviembre, cuatro startups españolas sumaron unos 165 millones de euros. Stark Future se lleva casi todo y se convierte en unicornio; las otras tres son rondas pequeñas con mucho que enseñar.","lesson":"Las rondas grandes llegan después de demostrar ventas reales. Las pequeñas, como la de Wilco, se cierran resolviendo un problema muy concreto para un cliente que ya paga, no con una idea genérica de IA.","action":"Escribe en una frase qué problema concreto resuelves, para qué tipo de cliente y qué prueba tienes hoy de que lo valora.","tool":"18_mapa_de_financiacion","sources":[["Forbes España","https://forbes.es/empresas/1070122/radar-de-rondas-cuatro-firmas-espanolas-captan-mas-de-165-millones/"],["Startups Españolas","https://startups-espanolas.es/las-5-mayores-rondas-de-la-semana-stark-future-lidera-con-150-millones-de-euros/"],["Tech.eu","https://tech.eu/2026/11/16/barcelona-based-stark-future-motors-to-unicorn-status/"]],"paragraphs":["La semana pasada dejó cuatro rondas destacadas de startups españolas. Forbes España calcula que juntas suman algo más de 165 millones de euros, aunque el reparto es muy desigual: una sola empresa se lleva más del 90 % del total.","Stark Future, el fabricante barcelonés de motos eléctricas, ha cerrado más de 150 millones de euros liderados por Highland Europe, con 1GT de Morgan Stanley Investment Management y Axon Partners Group. La ronda la valora en 1.200 millones antes de la inversión, lo que la convierte en la primera empresa europea de motos eléctricas que supera los 1.000 millones. Según sus fundadores, todo es capital, sin deuda, y el dinero irá a crecer fuera y a desarrollar nuevas plataformas eléctricas.","Fermat, una plataforma de IA que empezó ayudando a diseñar prendas y ahora quiere cubrir todo el proceso de producción de ropa, ha captado 8 millones de dólares liderados por Kibo Ventures y Lunar Ventures. Los usará para abrir oficina en Nueva York y ampliar producto.","Devengo, la fintech de pagos instantáneos entre cuentas autorizada por el Banco de España, ha cerrado 5 millones de euros combinando deuda y capital, con la entrada de Mutua Madrileña a través de Mutua Ventures. El objetivo es crecer y salir al exterior.","Wilco, que crea agentes de IA para que los pacientes de grupos de clínicas acudan a sus citas, ha levantado 2,5 millones de euros liderados por Samaipata. Ya trabaja con grupos dentales, oftalmológicos y de estética, y quiere reforzar ingeniería y ventas para entrar en el resto de Europa, Estados Unidos y Latinoamérica.","La lectura para quien empieza: los cuatro casos combinan un cliente muy definido con pruebas de negocio. Stark llegó aquí tras años vendiendo motos; Wilco, con clientes de nombre conocido. Antes de pensar en cuánto levantar, conviene saber qué demuestras y a quién."],"published":"2026-11-23T11:28:23.055958+00:00","generated_with_ai":true},{"url":"/noticias/las-startups-europeas-piden-retirar-la-version-recortada-de-eu-inc-c5ef5fd0.html","tag":"Emprendimiento","title":"Las startups europeas piden retirar la versión recortada de EU Inc","body":"EU–INC y Startups for Europe han pedido a Ursula von der Leyen que retire y vuelva a presentar la propuesta de EU Inc, la sociedad europea única para startups, porque los Estados miembros la han rebajado demasiado.","lesson":"La forma jurídica y las reglas de stock options importan desde el primer día: condicionan dónde constituyes, cómo atraes talento y cuánto cuesta cerrar si algo sale mal. Conviene seguir el debate aunque aún no te afecte.","action":"Revisa con tu asesoría cómo afectaría a tu proyecto constituir en otro país europeo y qué plan de incentivos para el equipo podrías ofrecer hoy en España.","tool":"23_cap_table_y_dilucion","sources":[["Trending Topics","https://www.trendingtopics.eu/eu-inc-withdrawal-startups-for-europe/"],["IO+","https://ioplus.nl/en/posts/european-startups-reject-watered-down-eu-inc-proposal"],["EU–INC","https://www.eu-inc.org/"]],"paragraphs":["EU Inc es la propuesta de la Comisión Europea para crear una forma de sociedad común a toda la Unión. La idea es que una startup pueda constituirse una vez, con reglas iguales en los 27 países, en lugar de irse a Delaware para tener un marco sencillo y conocido por los inversores.","La Comisión la presentó en marzo, pero en octubre los Estados miembros acordaron en el Consejo su posición negociadora y, según los colectivos de startups, eliminaron o rebajaron piezas clave. Por eso la iniciativa EU–INC, con más de 26.000 apoyos, y la red de asociaciones Startups for Europe han pedido a Ursula von der Leyen que retire el texto y lo vuelva a presentar.","Las críticas se centran en cuatro puntos. Las autoridades del país donde opera la empresa podrían cuestionar dónde se ha registrado. Las stock options al estilo europeo quedan fuera para compañías de más de 750 empleados o 150 millones de facturación. Desaparece el registro central europeo, así que siguen los 27 registros nacionales. Y se elimina el procedimiento sencillo para cerrar una empresa.","No todo el ecosistema piensa igual. La asociación alemana de startups ve el acuerdo del Consejo como un paso importante y prefiere defender la ambición original en la negociación final. Los sindicatos europeos, en cambio, quieren frenar el proceso hasta que se protejan mejor los derechos de los trabajadores.","El siguiente paso son las negociaciones entre Comisión, Consejo y Parlamento, que aún no han empezado. Para quien está montando su empresa ahora, nada cambia de inmediato, pero el resultado decidirá si en unos años será fácil crecer en Europa con una sola estructura."],"published":"2026-11-23T11:28:23.055958+00:00","generated_with_ai":true},{"tag":"Financiación", function tplFile(t, ext) { return `plantillas/Branka_Plantilla_${t.slug}.${ext}`; }
async function downloadTpl(t) {
  const msg = document.getElementById("dlmsg");
  const name = `Branka_Plantilla_${t.slug}.pdf`;
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (!dl) { msg.innerHTML = `Abre la plantilla y guárdala desde ahí: <a href="${tplFile(t, "pdf")}" target="_blank" rel="noopener">${name}</a>`; return; }
    msg.textContent = "Preparando la descarga…";
    const blob = await (await fetch(tplFile(t, "pdf"))).blob();
    await dl.save({ filename: name, data: blob });
    msg.textContent = "Plantilla descargada.";
  } catch (e) {
    if (e && e.code === "declined") { msg.textContent = "Descarga cancelada."; return; }
    msg.innerHTML = `No se pudo descargar aquí. Ábrela y guárdala desde ahí: <a href="${tplFile(t, "pdf")}" target="_blank" rel="noopener">${name}</a>`;
  }
}

function drawCard(o) {
  const c = document.createElement("canvas"); c.width = 1200; c.height = 630;
  const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, 1200, 630);
  g.addColorStop(0, "#ec8f35"); g.addColorStop(.45, "#e0602b"); g.addColorStop(1, "#da3a22");
  x.fillStyle = g; x.fillRect(0, 0, 1200, 630);
  x.fillStyle = "rgba(255,255,255,.10)"; x.beginPath(); x.ellipse(1050, 560, 330, 210, -0.5, 0, 7); x.fill();
  x.fillStyle = "rgba(255,255,255,.08)"; x.beginPath(); x.arc(980, 120, 140, 0, 7); x.fill();
  x.fillStyle = "#fff"; x.textBaseline = "top";
  x.font = "800 40px system-ui, sans-serif"; x.fillText("BRANKA", 70, 60);
  x.font = "600 26px system-ui, sans-serif"; x.fillStyle = "#fff3e8"; x.fillText(o.kicker, 70, 150);
  x.fillStyle = "#fff"; x.font = "800 " + (o.big.length > 12 ? 74 : 104) + "px system-ui, sans-serif"; x.fillText(o.big, 66, 196);
  x.font = "600 34px system-ui, sans-serif";
  const words = o.sub.split(" "); let line = "", y = 352;
  for (const w of words) { if (x.measureText(line + w).width > 1000) { x.fillText(line, 70, y); y += 46; line = ""; } line += w + " "; }
  x.fillText(line, 70, y);
  x.font = "600 26px system-ui, sans-serif"; x.fillStyle = "#fff3e8"; x.fillText(o.cta || "Hazlo tú también en branka.es", 70, 548);
  return c;
}

function wireShare(id, o) {
  const box = document.getElementById(id); if (!box) return;
  const canvas = drawCard(o);
  const img = new Image(); img.src = canvas.toDataURL("image/png"); img.alt = o.kicker + " " + o.big;
  box.querySelector(".share-prev").append(img);
  const url = SITE + "/#" + o.path;
  const text = o.text + " " + url;
  const msg = box.querySelector(".share-msg");
  box.querySelector('[data-a="li"]').href = "https://www.linkedin.com/sharing/share-offsite/?url=" + encodeURIComponent(url);
  box.querySelector('[data-a="wa"]').href = "https://wa.me/?text=" + encodeURIComponent(text);
  box.querySelector('[data-a="x"]').href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text);
  const download = () => { const a = document.createElement("a"); a.href = img.src; a.download = "branka-" + o.path.split("?")[0] + ".png"; a.click(); };
  box.querySelector('[data-a="dl"]').onclick = download;
  box.querySelector('[data-a="share"]').onclick = async () => {
    try {
      const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
      const file = new File([blob], "branka.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text, title: "Branka" });
      else if (navigator.share) await navigator.share({ text, url, title: "Branka" });
      else { await navigator.clipboard.writeText(text); msg.textContent = "Texto y enlace copiados. Pégalo donde quieras y añade la imagen descargada."; download(); }
    } catch (e) { /* cancelado */ }
  };
  const vs = box.querySelector('[data-a="vs"]');
  if (vs) vs.onclick = async () => {
    const link = SITE + "/#" + o.vs;

    } catch (e) {}
  };
}

/* Cableado común de los tests */
function wireQuiz(id, n, result) {
  const form = document.getElementById(id), prog = document.getElementById(id + "-prog");
  form.onchange = () => { prog.style.width = ([...Array(n).keys()].filter(i => form["q" + i].value).length / n * 100) + "%"; };
  form.onsubmit = e => {
    e.preventDefault();
    const vals = [...Array(n).keys()].map(i => form["q" + i].value);
    const miss = vals.findIndex(v => !v), msg = form.querySelector(".form-msg");
    if (miss >= 0) { msg.textContent = `Te falta la pregunta ${miss + 1}.`; form.querySelector(`[data-i="${miss}"]`).scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    msg.textContent = "";
    const out = document.getElementById(id + "-out");
    out.innerHTML = result(vals);
    out.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  window.scrollTo(0, 0);
}

const bigRes = (label, value, note, color) => `<div class="big-res" style="--pc:${color || "#e0602b"}"><small>${label}</small><b>${value}</b>${note ? `<p>${note}</p>` : ""}</div>`;

function renderRunway() {
  calcPage({ eyebrow: "Calculadora", title: "¿Cuántos meses de caja te quedan?", intro: "Calcula tu runway: cuánto tiempo puede aguantar tu proyecto con el dinero que tienes, y cuándo deberías empezar a buscar financiación.", tool: "19_tesoreria_burn_rate_y_runway",
    fields: [["cash", "Dinero en el banco hoy", 60000, 1000, "€"], ["burn", "Gastos al mes", 9000, 100, "€", "Sueldos, alquiler, herramientas, marketing…"], ["rev", "Ingresos al mes", 3000, 100, "€"], ["g", "Crecimiento mensual de ingresos", 5, 0.5, "%", "Si no lo sabes, pon 0"]],
    calc: v => {
      let cash = v.cash, rev = v.rev, m = 0;
      const net0 = v.burn - v.rev;
      while (cash > 0 && m < 120) { cash -= (v.burn - rev); rev *= 1 + v.g / 100; m++; if (rev >= v.burn) break; }
      const profitable = rev >= v.burn && cash > 0;
      const end = new Date(); end.setMonth(end.getMonth() + m);
      const when = end.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
      const color = profitable || m >= 12 ? "#2f7d6d" : m >= 6 ? "#e0602b" : "#da3a22";
      const raise = new Date(); raise.setMonth(raise.getMonth() + Math.max(0, m - 6));
      return (net0 <= 0 ? bigRes("Runway", "Rentable", "Tus ingresos ya cubren los gastos. ¡Enhorabuena!", "#2f7d6d")
        : profitable ? bigRes("Alcanzas la rentabilidad en", m + " meses", "Si el crecimiento se mantiene, llegas a cubrir gastos antes de quedarte sin caja.", color)
        : bigRes("Te quedan", (m >= 120 ? "+120" : m) + " meses", "Te quedarías sin caja hacia " + when + ".", color))
        + rows([["Consumo neto actual (burn)", eur(net0) + "/mes"], ["Busca financiación antes de", net0 > 0 && !profitable ? raise.toLocaleDateString("es-ES", { month: "long", year: "numeric" }) : "No es urgente"], ["Recomendación", m < 6 && !profitable ? "Recorta gastos o busca ingresos ya" : m < 12 && !profitable ? "Empieza a preparar la financiación" : "Situación cómoda: mantén el control"]]);
    } });
}
function renderDilution() {
  calcPage({ eyebrow: "Calculadora", title: "¿Cuánto te diluyes en una ronda?", intro: "Descubre qué porcentaje de tu empresa conservas después de una ronda de inversión, según cuánto entra y a qué valoración.", tool: "23_cap_table_y_dilucion",
    fields: [["own", "Tu participación hoy", 50, 1, "%"], ["inv", "Inversión que entra", 250000, 10000, "€"], ["pre", "Valoración antes de la ronda (pre-money)", 1500000, 50000, "€"], ["pool", "Bolsa de opciones para el equipo (nueva)", 10, 1, "%", "Suele pedirse entre un 5 y un 15 %. Pon 0 si no hay."]],
    calc: v => {
      const post = v.pre + v.inv, invPct = v.inv / post * 100;
      const remaining = (100 - invPct) * (1 - v.pool / 100);
      const mine = v.own * remaining / 100;
      return bigRes("Después de la ronda tendrás", pctf(mine), "Antes tenías un " + pctf(v.own) + ". Tu parte ahora vale " + eur(post * mine / 100) + " sobre el papel.")
        + rows([["Valoración después (post-money)", eur(post)], ["Porcentaje del inversor", pctf(invPct)], ["Bolsa de opciones", pctf((100 - invPct) * v.pool / 100)], ["Dilución de tu parte", pctf(v.own ? (1 - mine / v.own) * 100 : 0)]]);
    } });
}
function renderValuation() {
  calcPage({ eyebrow: "Calculadora", title: "¿Cuánto vale mi startup?", intro: "Una estimación orientativa con dos métodos habituales: múltiplo de ingresos (si ya vendes) y método de puntuación frente a una valoración de referencia (si estás empezando). Ajusta los supuestos a tu sector.", tool: "24_valoracion_y_terminos_de_inversion",
    fields: [["arr", "Ingresos anuales recurrentes", 120000, 10000, "€", "Pon 0 si aún no facturas"], ["mult", "Múltiplo de ingresos del sector", 4, 0.5, "x", "Supuesto editable: cambia mucho según sector y crecimiento"], ["base", "Valoración de referencia de una startup similar", 1500000, 50000, "€", "Supuesto editable: usa datos de rondas comparables"], ["team", "Equipo (0 a 10)", 7, 1, ""], ["market", "Tamaño de mercado (0 a 10)", 6, 1, ""], ["product", "Producto (0 a 10)", 6, 1, ""], ["traction", "Tracción (0 a 10)", 5, 1, ""]],
    calc: v => {
      const clamp = x => Math.min(10, Math.max(0, x));
      const score = clamp(v.team) * .3 + clamp(v.market) * .25 + clamp(v.product) * .2 + clamp(v.traction) * .25;
      const scVal = v.base * (0.5 + score / 10);
      const revVal = v.arr * v.mult;
      const est = v.arr > 0 ? (revVal + scVal) / 2 : scVal;
      return bigRes("Valoración orientativa", eur(est * .8) + " – " + eur(est * 1.2), v.arr > 0 ? "Media de los dos métodos, con un margen de ±20 %." : "Basada en el método de puntuación, con un margen de ±20 %.")
        + rows([["Por múltiplo de ingresos", v.arr > 0 ? eur(revVal) : "Sin ingresos aún"], ["Por puntuación (" + score.toFixed(1).replace(".", ",") + "/10)", eur(scVal)], ["Aviso", "La valoración final la marca la negociación con inversores"]]);
    } });
}
function renderRate() {

const AY_STATUS = { abierta: "Abierta", permanente: "Siempre abierta", consultar: "Consulta el plazo", proxima: "Próxima apertura", cerrada: "Cerrada" };
const fdate = (s, y) => new Date(s + "T12:00:00").toLocaleDateString("es-ES", y ? { day: "numeric", month: "long", year: "numeric" } : { day: "numeric", month: "long" });
function ayState(a) {
  const now = new Date();
  if (a.deadline && new Date(a.deadline + "T23:59:59") < now) return ["cerrada", "Cerrada el " + fdate(a.deadline, true)];
  if (a.opens && new Date(a.opens + "T00:00:00") > now) return ["proxima", "Abre el " + fdate(a.opens, true)];
  if (a.deadline && a.status !== "cerrada") {
    const days = Math.ceil((new Date(a.deadline + "T23:59:59") - now) / 864e5);
    return ["abierta", days <= 15 ? `¡Cierra en ${days} día${days === 1 ? "" : "s"}!` : "Abierta hasta el " + fdate(a.deadline)];
  }
  return [a.status === "proxima" ? "consultar" : a.status, AY_STATUS[a.status] || a.status];
}

/* Vídeos guardados: db (quién va con qué) + assets (los MP4). */
function keyForFile(name) {
  const n = name.toLowerCase();
  if (n.startsWith("ia_negocios_semana")) return NEWS.videoKey;
  const m = n.match(/pildora_(\d{2})_/);
  if (m) { const t = TOOLS.find(x => x.n === +m[1]); return t ? t.slug : null; }
  const t = TOOLS.find(x => n.includes(x.slug)); return t ? t.slug : null;
}

function wireAdmin() {
  const box = document.getElementById("admin");
  if (!box || !state.assets || !state.db) return;
  box.hidden = false;
  const input = document.getElementById("file-in"), drop = document.getElementById("drop"), log = document.getElementById("log");
  const line = (txt, cls) => { const d = document.createElement("div"); d.className = cls || ""; d.textContent = txt; log.prepend(d); };
  async function handle(files) {
    for (const f of files) {
      const key = keyForFile(f.name);
      if (!key) { line(`${f.name}: no sé a qué píldora pertenece. Renómbralo como Pildora_NN_….mp4.`, "bad"); continue; }
      try {
        line(`Subiendo ${f.name}…`);
        const a = await state.assets.upload(f);
        await state.db.doc("videos/" + key).set({ assetId: a.id, file: f.name, updated: new Date().toISOString() });
        line(`${f.name}: listo`, "good");
      } catch (e) { line(`${f.name}: no se pudo subir (${e && e.message ? e.message : e}). Vuelve a intentarlo.`, "bad"); }
    }
  }
  input.onchange = () => handle([...input.files]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); handle([...e.dataTransfer.files]); };
}

(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const db = await window.claude.use("db");
    if (db) {
      state.db = db;
      db.collection("videos").onSnapshot(snap => {
        const v = {};
        (snap.docs || snap).forEach(d => { const data = typeof d.data === "function" ? d.data() : d.data; v[d.id] = data; });
        state.videos = v;
        const playing = document.querySelector("video");
        if (!playing || playing.paused) route();
      }, () => {});
    }
    const assets = await window.claude.use("assets");
    if (assets) { state.assets = assets; wireAdmin(); }
  } catch (e) { /* la página funciona sin vídeos guardados */ }
})();

    app.classList.add("enter");

    document.querySelectorAll(".hero, .news-head").forEach(h => {
      if (!h.querySelector(".blobs")) h.insertAdjacentHTML("afterbegin", '<div class="blobs" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>');
    });

    clearInterval(timer);
    const h1 = document.querySelector(".hero.home h1");
    if (h1 && !h1.querySelector(".rot")) {
      wi = 0;
      h1.innerHTML = 'Emprende con alguien que ya ha <span class="rot"><span>pasado por ahí</span></span>';
      if (!reduce) {
        timer = setInterval(() => {
          const r = h1.querySelector(".rot");
          if (!r || !document.body.contains(r)) return clearInterval(timer);
          wi = (wi + 1) % WORDS.length;
          const cur = r.querySelector("span:not(.out)");
          if (cur) { cur.classList.add("out"); setTimeout(() => cur.remove(), 520); }
          const s = document.createElement("span");
          s.textContent = WORDS[wi];
          r.appendChild(s);
        }, 2600);
      }
    }

    const hero = document.querySelector(".hero.home");
    if (hero && !app.querySelector(".marquee")) {
      const items = TOPICS.concat(TOPICS).map(t => `<span>${t}</span>`).join("");
      hero.insertAdjacentHTML("afterend", `<div class="marquee" aria-hidden="true"><div class="mq-track">${items}</div></div>`);
    }
    observer.observe(app, { childList: true });
  }

  const observer = new MutationObserver(decorate);
  decorate();

  // Luz que sigue al cursor en las tarjetas
  document.addEventListener("pointermove", e => {
    const c = e.target.closest && e.target.closest(".card, .res-card, .stage, .inc, .story, .ep");
    if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", `${e.clientX - r.left}px`);
    c.style.setProperty("--my", `${e.clientY - r.top}px`);
  }, { passive: true });
})();

</script>
</body>
</html>
